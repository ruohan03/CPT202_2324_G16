<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Course - Trainer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-top: 50px;
        }
        .trainer-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .trainer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .trainer-card.selected {
            border: 2px solid #007bff;
        }
        .trainer-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">Select a Trainer</h1>
    <div class="row" id="trainerList">
        <!-- Trainer list will be dynamically inserted here -->
    </div>
    <div class="text-center mt-4">
        <button id="confirmBookingBtn" class="btn btn-primary" disabled>Confirm Booking</button>
    </div>
</div>

<script>
    // 模拟的教练数据
    const trainers = [
        {
            id: 1,
            firstName: 'John',
            lastName: 'Doe',
            avatar: 'https://via.placeholder.com/100'
        },
        {
            id: 2,
            firstName: 'Jane',
            lastName: 'Smith',
            avatar: 'https://via.placeholder.com/100'
        },
        {
            id: 3,
            firstName: 'Michael',
            lastName: 'Johnson',
            avatar: 'https://via.placeholder.com/100'
        },
        {
            id: 4,
            firstName: 'Emily',
            lastName: 'Brown',
            avatar: 'https://via.placeholder.com/100'
        }
    ];

    // 选中的教练
    let selectedTrainer = null;

    // 渲染教练列表
    const trainerList = document.getElementById('trainerList');
    trainers.forEach(trainer => {
        const trainerCard = document.createElement('div');
        trainerCard.classList.add('col-md-4', 'mb-4');

        const card = document.createElement('div');
        card.classList.add('card', 'trainer-card');
        card.addEventListener('click', () => selectTrainer(trainer));

        const avatar = document.createElement('img');
        avatar.classList.add('card-img-top', 'trainer-avatar');
        avatar.src = trainer.avatar;

        const body = document.createElement('div');
        body.classList.add('card-body', 'text-center');

        const name = document.createElement('h5');
        name.classList.add('card-title');
        name.textContent = `${trainer.firstName} ${trainer.lastName}`;

        body.appendChild(name);
        card.appendChild(avatar);
        card.appendChild(body);
        trainerCard.appendChild(card);
        trainerList.appendChild(trainerCard);
    });

    // 选中教练
    function selectTrainer(trainer) {
        // 先取消之前选中的教练
        if (selectedTrainer) {
            selectedTrainer.classList.remove('selected');
        }

        // 选中当前教练
        const trainerCard = event.currentTarget;
        trainerCard.classList.add('selected');
        selectedTrainer = trainerCard;

        // 启用确认预约按钮
        document.getElementById('confirmBookingBtn').disabled = false;
    }

    // 确认预约
    document.getElementById('confirmBookingBtn').addEventListener('click', () => {
        if (selectedTrainer) {
            const trainerName = selectedTrainer.querySelector('.card-title').textContent;
            const confirmBooking = confirm(`You have selected ${trainerName} for the course. Confirm booking?`);
            if (confirmBooking) {
                alert('Booking successful!');
                window.location.href = 'home_page.html';
            }
        } else {
            alert('Please select a trainer first.');
        }
    });
</script>
</body>
</html>
