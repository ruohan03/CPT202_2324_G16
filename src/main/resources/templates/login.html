<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>H-XYZ</title>
    <title>Member Login</title>

    <link rel="stylesheet" href="/css/Login.css">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">H-XYZ Fitness Appointment System</div>
    </div>
    <a href="/navigation" class="nav-button">Return</a>
</nav>


<div class="login-centered-container">
    <div class="login-form">
        <h1>Member Login</h1>
        <!-- 使用 th:if 来检查是否有 flash 属性 'error' -->
        <div id="error-message" class="error-message" style="display: none;">Invalid credentials. Please try again.</div>
            <form th:action="@{/login}" method="post">
        <div class="form-group">
            <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone number" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <div id="registerOption">
            <a href="/forgot-password" > Forgot Password?</a>
            <p>Don't have an account? <a href="/register">Sign up here</a>.</p>
        </div>

                <!-- 在登录表单下方添加一个 div 来显示成功消息 -->
                <div th:if="${param.password_updated}">
                    <div class="success-message-container">
                        <div class="success-message">Password updated successfully.</div>
                    </div>
                </div>
            </form>
    </div>
</div>
<script>
    // 检查URL中是否有错误参数，如果有，显示错误消息
    if (window.location.search.indexOf('error=true') !== -1) {
        document.getElementById('error-message').style.display = 'block';
    }

    document.addEventListener("DOMContentLoaded", function() {
        const successMessage = document.querySelector('.success-message');
        if (successMessage) {
            setTimeout(() => {
                successMessage.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
            }, 3000); // 设置延时为 5000 毫秒（5 秒）
        }
    });
</script>

</body>
</html>
