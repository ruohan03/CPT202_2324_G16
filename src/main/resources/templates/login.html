<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Login</title>
    <style>
        #registerOption{
            text-align: center;
            margin-top: 20px;
        }
        #registerOption a{
            color: #CE56C1;
            text-decoration: none;
        }
        #registerOption p{
            color: #999999;
        }
        /* CSS样式 */
        .success-message-container {
            text-align: center;
            animation: slideIn 0.5s ease-in-out forwards;
        }

        .success-message {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            font-size: 18px; /* 设置字体大小为18px */
        }

        /* 定义动画 */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-centered-container">
    <div class="login-form">
        <h1>Member Login</h1>
        <!-- 使用 th:if 来检查是否有 flash 属性 'error' -->
        <div id="error-message" class="error-message" style="display: none;">Invalid credentials. Please try again.</div>
            <form th:action="@{/login}" method="post">
        <div class="form-group">
            <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone number" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <div id="registerOption">
            <a href="/forgot-password" > Forget Password?</a>
            <p>Don't have an account? <a href="/register">Sign up here.</a></p>
        </div>
                <!-- 在登录表单下方添加一个 div 来显示成功消息 -->
                <div th:if="${param.password_updated}">
                    <div class="success-message-container">
                        <div class="success-message">Password updated successfully.</div>
                    </div>
                </div>
            </form>
    </div>
</div>
<script>
    // 检查URL中是否有错误参数，如果有，显示错误消息
    if (window.location.search.indexOf('error=true') !== -1) {
        document.getElementById('error-message').style.display = 'block';
    }
</script>

</body>
</html>
