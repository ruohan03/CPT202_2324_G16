<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-form">
    <h1>Login</h1>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <!-- Error message container placed here -->
        <div id="error-message" class="error-message" th:if="${error}" th:text="${error}" style="display: none;"></div>

        <button type="submit" class="btn">Login</button>
    </form>
</div>

<!-- Custom modal container -->
<div id="custom-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <span id="modal-error-message">Invalid phone number or password.</span>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var error = [[${error}]];
    var modal = document.getElementById('custom-modal');
    var errorMessageDiv = document.getElementById('error-message');

    if (error) {
        errorMessageDiv.textContent = error;
        errorMessageDiv.style.display = 'block'; // Display the in-page error message
        modal.style.display = 'flex'; // Display the modal with the error
    }

    // Hide only the modal when user clicks anywhere outside the modal content
    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = "none";
            // Do not hide the in-page error message
            // errorMessageDiv.style.display = "none"; // Remove or comment out this line
        }
    };
    /*]]>*/
</script>


</body>
</html>
