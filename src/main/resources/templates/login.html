<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-form">
    <h1>Login</h1>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <div>
                <label><input type="radio" name="loginType" value="user" checked> User</label>
                <label><input type="radio" name="loginType" value="admin"> Admin</label>
            </div>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // This script will check for an error message and display it if present
    var error = [[${error}]]; // Make sure that this matches exactly with the model attribute name
    if (error && error !== '') {
        alert(error); // Display an alert if there is an error
    }
    /*]]>*/
</script>

</body>
</html>
