<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Lessons</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.css">
    <style>
        .cancel-form{
            margin: 0;
            padding: 0;
        }
        .center-content {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="content-wrap">
    <div th:replace="member-nav.html :: top-nav"></div>
    <div class="content-body center-content">
        <div class="col-lg-10 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h3 class="text-center" style="margin-top: -20px">Upcoming Lessons</h3>
                    <div class="margin-bottom">
                        <div class="btn-group">
                            <a href="/member/all-appointments" class="btn btn-light btn-sm btn-rounded">All Appointments</a>
                            <a href="/member/incomplete" class="btn btn-dark btn-sm btn-rounded">Upcoming Lessons</a>
                            <a href="/member/completed" class="btn btn-light btn-sm btn-rounded">Completed Lessons</a>
                        </div>
                    </div>
                    <H4 th:if="${incompleteReservations.isEmpty()}" class="text-danger">No Upcoming Lesson</H4>
                    <table class="table table-hover" id="incompletedReservationTable" th:if="${!incompleteReservations.isEmpty()}">
                        <thead>
                        <tr style="text-align: center;">
                            <th>Reservation ID</th>
                            <th>Staff Name</th>
                            <th>Course Name</th>
                            <th>Lesson Time</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="reservation : ${incompleteReservations}">
                            <td th:text="${reservation.reservationId}"></td>
                            <td th:text="${staffMap[reservation.reservationId].name}"></td>
                            <td th:text="${courseMap[reservation.reservationId].name}"></td>
                            <td th:text="${reservation.lessonStartDate}+'    '+${reservation.lessonStartTime}+' - '+${reservation.lessonEndTime}"></td>
                            <td>
                                <p th:if="${reservation.isCancelled}" style="color: red;">Cancelled</p>
                                <!-- Cancel reservation button, only displayed for courses that have not started -->
                                <form th:if="${!reservation.isCancelled && reservation.lessonStartDate.isAfter(T(java.time.LocalDate).now())}" th:action="@{/cancel}" method="post" class="cancel-form">
                                    <input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />
                                    <button type="submit" class="btn btn-danger btn-sm">Cancel</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white mt-4">
        <div class="container py-3">
            <div class="row">
                <div class="col-md-6">
                    <h5>Contact Us</h5>
                    <address>
                        <strong>Fitness Center Inc.</strong><br>
                        123 Fitness Blvd.<br>
                        Wellness City, 98765<br>
                        <abbr title="Phone">P:</abbr> (123) 456-7890
                    </address>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-white">Twitter</a></li>
                        <li><a href="#" class="text-white">Facebook</a></li>
                        <li><a href="#" class="text-white">Instagram</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</div>

<script type="text/javascript" charset="utf8" src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.js"></script>
<script>
    $(document).ready(function() {
        $('#incompletedReservationTable').DataTable();
    });
</script>
</body>
</html>
