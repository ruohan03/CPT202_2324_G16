<form action="/search" method="get">
    <label for="date">Select Date:</label>
    <input type="date" id="date" name="date" />
    <button type="submit">Filter</button>
</form>
<ul th:if="${!incompleteReservations.isEmpty()}">
    <li th:each="reservation : ${incompleteReservations}">
        <div>
            <h3 th:text="${reservation.courseId}">Course Name</h3>

            <p th:text="'Date: ' + ${reservation.lessonStartDate} + ', Time: ' + ${reservation.lessonStartTime} + ' - ' + ${reservation.lessonEndTime}">Course Time</p>
            <p th:text="'Instructor: ' + ${reservation.staffId}">Instructor Name</p>
            <p th:text="'Reservation ID: ' + ${reservation.reservationId}">Reservation ID</p>

            <!-- Sign-in button, only displayed for reservations that have not been signed in and the course has not ended -->
            <form th:if="${!reservation.isSignIn && !reservation.isCancelled && reservation.lessonStartDate.isAfter(T(java.time.LocalDate).now()) || (reservation.lessonStartDate.isEqual(T(java.time.LocalDate).now()) && reservation.lessonEndTime.isAfter(T(java.time.LocalTime).now()))}" th:action="@{/signin}" method="post" class="signin-form">
                <input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />
                <button type="submit">Sign In</button>
            </form>

            <!-- Cancel reservation button, only displayed for courses that have not started -->
            <form th:if="${!reservation.isCancelled && reservation.lessonStartDate.isAfter(T(java.time.LocalDate).now())}" th:action="@{/cancel}" method="post" class="cancel-form">
                <input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />
                <button type="submit">Cancel Reservation</button>
            </form>

            <!-- Logic for marking as absent -->
            <p th:if="${!reservation.isSignIn && reservation.lessonStartDate.isBefore(T(java.time.LocalDate).now()) || (reservation.lessonStartDate.isEqual(T(java.time.LocalDate).now()) && reservation.lessonEndTime.isBefore(T(java.time.LocalTime).now()))}" style="color: red;">Absent</p>

            <!-- Displaying cancelled and signed-in status -->
            <p th:if="${reservation.isCancelled}" style="color: red;">Cancelled</p>
        </div>
    </li>
</ul>
<p th:if="${incompleteReservations.isEmpty() and selectedDate != null}">No incomplete reservations for the selected date</p>
<p th:if="${incompleteReservations.isEmpty() and selectedDate == null}">No incomplete reservations</p>
