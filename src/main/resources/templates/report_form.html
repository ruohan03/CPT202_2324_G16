<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Report Form</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
</head>
<body>
<div class="container-scroller">
    <div th:replace="manager-nav.html"></div>
    <div class="main-panel">
        <div class="content-wrapper">
            <div style="margin-top: 50px;">
                <div class="d-flex justify-content-center align-items-center vh-100">
                    <div class="col-md-9 grid-margin stretch-card">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Generate Sales Report</h4>
                                <p class="card-description">
                                    Please fill out the information below
                                </p>
                                <form action="/admin/reports" method="post" class="forms-sample">
                                    <div class="form-group">
                                        <label for="startDate">Start Date</label>
                                        <input type="date" class="form-control" id="startDate" name="startDate" placeholder="Start Date" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="endDate">End Date</label>
                                        <input type="date" class="form-control" id="endDate" name="endDate" placeholder="End Date" required>
                                    </div>

                                    <button type="submit" class="btn btn-block btn-outline-success">Generate Report</button>
                                    <button type="button" id="oneWeekBtn" class="btn btn-block btn-outline-dark">Last Week</button>
                                    <button type="button" id="oneMonthBtn" class="btn btn-block btn-outline-dark">Last Month</button>
                                    <button type="button" id="oneYearBtn" class="btn btn-block btn-outline-dark">Last Year</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
                <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
            </div>
        </footer>
    </div>
</div>

<script src="/js/report-form.js"></script>
</body>
</html>
