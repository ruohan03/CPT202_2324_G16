<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Report Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
        }
        input[type="date"] {
            margin-bottom: 10px;
            padding: 8px;
        }
        button {
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Generate Sales Report</h1>
    <form action="/admin/reports" method="post">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" name="startDate" required>

        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" name="endDate" required>

        <button type="submit">Generate Report</button>
        <button type="button" id="oneWeekBtn">Last Week</button>
        <button type="button" id="oneMonthBtn">Last Month</button>
        <button type="button" id="oneYearBtn">Last Year</button>
    </form>
</div>

<script src="/js/report_form.js">
</script>
</body>
</html>
