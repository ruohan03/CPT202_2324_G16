<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/reserve-step-arrow.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.css">
</head>
<body>
<div class="content-wrap">
    <div th:replace="member-nav.html :: top-nav"></div>
    <div class="content-body">
        <div class="reservation-steps">
            <div class="step active" data-href="/member/order/course">Select Course</div>
            <div class="step " data-href="/member/select-trainer">Select Trainer</div>
            <div class="step" data-href="/member/select-time">Select Time</div>
            <div class="step" data-href="/member/confirm-reservation">Confirm</div>
        </div>

        <!-- 添加表单提交课程ID -->
        <form th:action="@{/member/select-trainer}" method="get">
            <input type="hidden" id="memberId" name="memberId" th:value="${member.memberId}" />
            <table class="table table-hover" id="courseTable">
                <thead>
                <tr>
                    <th class="text-center">Course Name</th>
                    <th class="text-center">Location</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody>
                <!-- Active Courses -->
                <tr th:each="course : ${courses}" th:if="${course.active}">
                    <td th:text="${course.name}"></td>
                    <td th:text="${course.location}"></td>
                    <td>
                        <button class="select-button" type="submit" name="courseId" th:value="${course.courseId}">Select</button>
                    </td>
                </tr>
                <!-- Inactive Courses -->
                <tr th:each="course : ${courses}" th:if="${!course.active}" style="color: red;">
                    <td th:text="${course.name}"></td>
                    <td th:text="${course.location}"></td>
                    <td>No Access, Please try it in the future</td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
    <footer class="bg-dark text-white mt-4">
        <div class="container py-3">
            <div class="row">
                <div class="col-md-6">
                    <h5>Contact Us</h5>
                    <address>
                        <strong>Fitness Center Inc.</strong><br>
                        123 Fitness Blvd.<br>
                        Wellness City, 98765<br>
                        <abbr title="Phone">P:</abbr> (123) 456-7890
                    </address>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-white">Twitter</a></li>
                        <li><a href="#" class="text-white">Facebook</a></li>
                        <li><a href="#" class="text-white">Instagram</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</div>
<script src="/js/reserve-nav.js"></script>
<script type="text/javascript" charset="utf8" src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.js"></script>
<script>
    $(document).ready(function() {
        $('#courseTable').DataTable();
    });
</script>
</body>
</html>
