<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/reserve-step-arrow.css">
</head>
<body>
<div th:replace="member-nav :: top-nav"></div>

<div class="reservation-steps">
    <div class="step active" data-href="/member/order/course">Select Course</div>
    <div class="step " data-href="/member/select-trainer">Select Trainer</div>
    <div class="step" data-href="/member/select-time">Select Time</div>
    <div class="step" data-href="/member/confirm-reservation">Confirm</div>
</div>

<!-- 添加表单提交课程ID -->
<form th:action="@{/member/select-trainer}" method="get">
    <input type="hidden" id="memberId" name="memberId" th:value="${member.memberId}" />
    <table>
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Location</th>
            <th>Select</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.name}"></td>
            <td th:text="${course.location}"></td>
            <td>
                <button class="select-button" type="submit" name="courseId" th:value="${course.courseId}">Select</button>
            </td>
        </tr>
        </tbody>
    </table>
</form>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 如果页面有课程选择的表单或链接，确保每个选择都附带课程ID
        const courseLinks = document.querySelectorAll('.course-link'); // 假设每个课程链接都有类名 'course-link'
        courseLinks.forEach(link => {
            link.addEventListener('click', function() {
                const courseId = this.getAttribute('data-course-id');
                window.location.href = `/member/select-trainer?courseId=${courseId}`;
            });
        });
        // 检查每一步是否应该激活
        const steps = document.querySelectorAll('.reservation-steps .step');
        let isPreviousCompleted = true; // 前一步是否完成

        steps.forEach((step, index) => {
            // 如果步骤已完成，激活点击事件，否则禁用
            if (step.classList.contains('completed') || isPreviousCompleted) {
                step.addEventListener('click', function() {
                    const url = this.getAttribute('data-href');
                    if (url) {
                        window.location.href = url;
                    }
                });
            } else {
                // 禁用未完成的步骤的点击事件
                step.style.pointerEvents = 'none';
                step.style.opacity = '0.5'; // 给未激活的步骤一个明显的视觉差异
            }

            // 更新是否所有前步都已完成的状态
            isPreviousCompleted = step.classList.contains('completed');
        });

    });
</script>


</body>
</html>
