<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="member-nav :: top-nav"></div>
<!-- 添加表单提交课程ID -->
<form th:action="@{/member/select-coach}" method="post">
    <table>
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Location</th>
            <th>Select</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.name}"></td>
            <td th:text="${course.location}"></td>
            <td>
                <button type="submit" name="courseId" th:value="${course.courseId}">Select</button>
            </td>
        </tr>
        </tbody>
    </table>
</form>


</body>
</html>
