<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${member.name} + ': Profile'">Profile</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navigation Bar -->
<div th:replace="member-nav :: top-nav"></div>
<!-- Profile Container -->
<div class="member-profile-container">
    <h1 class="member-profile-header">Member Profile</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/member/update/{memberId}(memberId=${member.memberId})}" th:object="${member}" method="post">
        <table class="member-profile-table">
            <tr>
                <th>ID</th>
                <td th:text="${member.memberId}"></td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <input type="text" th:field="*{name}" class="text-input" disabled data-original-value="${member.name}">
                </td>
            </tr>
            <tr>
                <th>Phone</th>
                <td th:text="${member.phone}"></td>
            </tr>
            <tr>
                <th>Gender</th>
                <td th:text="${member.gender}"></td>
            </tr>
            <tr>
                <th>Address</th>
                <td>
                    <input type="text" th:field="*{address}" class="text-input" disabled data-original-value="${member.address}">
                </td>
            </tr>
            <tr>
                <th>Weight</th>
                <td>
                    <input type="text" th:field="*{weight}" class="text-input" disabled data-original-value="${member.weight}">
                </td>
            </tr>
            <tr>
                <th>Height</th>
                <td>
                    <input type="text" th:field="*{height}" class="text-input" disabled data-original-value="${member.height}">
                </td>
            </tr>
        </table>
        <div class="button-container">
            <button type="button" onclick="enableEdit()" class="edit-button">Edit</button>
            <button type="submit" class="save-button" style="display: none;">Save</button>
            <button type="button" class="cancel-button" style="display: none;" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>

<script>
    function enableEdit() {
        // Enable edit mode and make editable fields active
        const container = document.querySelector('.member-profile-container');
        container.classList.add('edit-mode');
        document.querySelectorAll('.member-profile-table .text-input').forEach(function(input) {
            if (input.hasAttribute('data-original-value')) {
                input.disabled = false; // Enable only those inputs which have original values set
            }
        });
        document.querySelector('.edit-button').style.display = 'none';
        document.querySelector('.save-button').style.display = 'inline';
        document.querySelector('.cancel-button').style.display = 'inline';
    }

    function cancelEdit() {
        const container = document.querySelector('.member-profile-container');
        container.classList.remove('edit-mode');
        document.querySelectorAll('.member-profile-table .text-input').forEach(function(input) {
            input.disabled = true;
            // 这一行会将输入框的值重置为其在 data-original-value 属性中的原始值
            input.value = input.getAttribute('data-original-value');
        });
        document.querySelector('.edit-button').style.display = 'inline';
        document.querySelector('.save-button').style.display = 'none';
        document.querySelector('.cancel-button').style.display = 'none';
        location.reload();
    }


</script>
</body>
</html>
