<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${member.name} + ': Profile'">Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</head>
<body th:data-member-id="${session.memberId}">
<div th:replace="member-nav.html :: top-nav"></div>

<!-- Profile Container -->
<div class="profile-container">
    <h1 class="profile-header">Member Profile</h1>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-danger" th:text="${error}"></div>
    <form th:action="@{/member/update/{memberId}(memberId=${member.memberId})}" th:object="${member}" method="post">
        <table class="profile-table">
            <tr>
                <th>ID</th>
                <td th:text="${member.memberId}"></td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <input type="text" th:field="*{name}" class="text-input" disabled data-original-value="${member.name}" th:data-value="${member.name}">
                    <span class="text-display" th:data-value="${member.name}"></span>
                </td>
            </tr>
            <tr>
                <th>Phone</th>
                <td th:text="${member.phone}"></td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <select id="genderSelect" th:field="*{gender}" class="text-input" disabled>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                    <span id="genderDisplay" class="text-display" th:data-value="${member.gender}"></span>
                </td>
            </tr>
            <tr>
                <th>Address</th>
                <td>
                    <input type="text" th:field="*{address}" class="text-input" disabled data-original-value="${member.address}" th:data-value="${member.address}">
                    <span class="text-display" th:data-value="${member.address}"></span>
                </td>
            </tr>
            <tr>
                <th>Weight (KG)</th>
                <td>
                    <input type="text" pattern="^\d*\.?\d*$" th:field="*{weight}" class="text-input" disabled data-original-value="${member.weight}" th:data-value="${member.weight}" title="numbers only!">
                    <span class="text-display" th:data-value="${member.weight}"></span>
                </td>
            </tr>
            <tr>
                <th>Height (CM)</th>
                <td>
                    <input type="text" pattern="^\d*\.?\d*$" th:field="*{height}" class="text-input" disabled data-original-value="${member.height}" th:data-value="${member.height}" title="numbers only!">
                    <span class="text-display" th:data-value="${member.height}"></span>
                </td>
            </tr>
        </table>
        <div class="button-container">
            <button type="button" id="editButton" onclick="enableEdit()" class="edit-button">Edit</button>
            <button type="submit" id="saveButton" class="save-button" style="display: none;">Save</button>
            <button type="button" id="cancelButton" class="cancel-button" style="display: none;" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>
<footer class="bg-dark text-white mt-4">
    <div class="container py-3">
        <div class="row">
            <div class="col-md-6">
                <h5>Contact Us</h5>
                <address>
                    <strong>Fitness Center Inc.</strong><br>
                    123 Fitness Blvd.<br>
                    Wellness City, 98765<br>
                    <abbr title="Phone">P:</abbr> (123) 456-7890
                </address>
            </div>
            <div class="col-md-6">
                <h5>Follow Us</h5>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white">Twitter</a></li>
                    <li><a href="#" class="text-white">Facebook</a></li>
                    <li><a href="#" class="text-white">Instagram</a></li>
                </ul>
            </div>
        </div>
    </div>
</footer>
<script src="/js/member-profile.js"></script>
<script src="/js/nav-book-course.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</body>
</html>
