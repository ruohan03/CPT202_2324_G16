<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${member.name} + ': Profile'">Profile</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navigation Bar -->
<div th:replace="member-nav :: top-nav"></div>
<!-- Profile Container -->
<div class="profile-container">
    <h1 class="profile-header">Member Profile</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/member/update/{memberId}(memberId=${member.memberId})}" th:object="${member}" method="post">
        <table class="profile-table">
            <tr>
                <th>ID</th>
                <td th:text="${member.memberId}"></td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <input type="text" th:field="*{name}" class="text-input" disabled data-original-value="${member.name}" th:data-value="${member.name}">
                    <span class="text-display" th:data-value="${member.name}"></span>
                </td>
            </tr>
            <tr>
                <th>Phone</th>
                <td th:text="${member.phone}"></td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <select id="genderSelect" th:field="*{gender}" class="text-input" disabled>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                    <span id="genderDisplay" class="text-display" th:data-value="${member.gender}"></span>
                </td>
            </tr>
            <tr>
                <th>Address</th>
                <td>
                    <input type="text" th:field="*{address}" class="text-input" disabled data-original-value="${member.address}" th:data-value="${member.address}">
                    <span class="text-display" th:data-value="${member.address}"></span>
                </td>
            </tr>
            <tr>
                <th>Weight (KG)</th>
                <td>
                    <input type="number" pattern="^\d*\.?\d*$" th:field="*{weight}" class="text-input" disabled data-original-value="${member.weight}" th:data-value="${member.weight}" title="numbers only!">
                    <span class="text-display" th:data-value="${member.weight}"></span>
                </td>
            </tr>
            <tr>
                <th>Height (CM)</th>
                <td>
                    <input type="number" pattern="^\d*\.?\d*$" th:field="*{height}" class="text-input" disabled data-original-value="${member.height}" th:data-value="${member.height}" title="numbers only!">
                    <span class="text-display" th:data-value="${member.height}"></span>
                </td>
            </tr>
        </table>
        <div class="button-container">
            <button type="button" id="editButton" onclick="enableEdit()" class="edit-button">Edit</button>
            <button type="submit" id="saveButton" class="save-button" style="display: none;">Save</button>
            <button type="button" id="cancelButton" class="cancel-button" style="display: none;" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>

<script>
    window.onload = function() {
        const genderSelect = document.getElementById('genderSelect');
        const genderDisplay = document.getElementById('genderDisplay');

        // 初始化显示的性别
        const initialGender = genderSelect.options[genderSelect.selectedIndex].text;
        genderDisplay.textContent = initialGender;

        // 处理select元素的change事件
        genderSelect.addEventListener('change', function() {
            // 更新member.gender的值
            member.gender = genderSelect.value;
            // 更新genderDisplay的文本内容
            genderDisplay.textContent = genderSelect.options[genderSelect.selectedIndex].text;
        });

        document.getElementById('editButton').addEventListener('click', function() {
            // 进入编辑模式
            genderSelect.disabled = false;
            genderDisplay.style.display = 'none';
            genderSelect.style.display = 'block';
        });

        document.getElementById('cancelButton').addEventListener('click', function() {
            // 退出编辑模式
            genderSelect.disabled = true;
            genderDisplay.style.display = 'block';
            genderSelect.style.display = 'none';
            // 重置select元素的值
            genderSelect.value = initialGender;
            // 更新genderDisplay的文本内容
            genderDisplay.textContent = genderSelect.options[genderSelect.selectedIndex].text;
        });

        enableEdit();
        cancelEdit();
    };

    function enableEdit() {
        // Enable edit mode and make editable fields active
        const container = document.querySelector('.profile-container');
        container.classList.add('edit-mode');
        document.querySelectorAll('.profile-table .text-input, .profile-table select.text-input').forEach(function(input) {
            if (input.hasAttribute('data-original-value')) {
                input.disabled = false; // Enable only those inputs which have original values set
                input.style.display = 'block'; // Show input
                input.nextElementSibling.style.display = 'none'; // Hide span
                input.value = input.getAttribute('data-value'); // Display the actual value instead of the Thymeleaf expression
            }
        });
        document.querySelector('.edit-button').style.display = 'none';
        document.querySelector('.save-button').style.display = 'inline';
        document.querySelector('.cancel-button').style.display = 'inline';

        // Set the value of the genderSelect element to the current gender
        const genderSelect = document.getElementById('genderSelect');
        const genderDisplay = document.getElementById('genderDisplay');
        genderSelect.value = genderDisplay.textContent;
    }

    function cancelEdit() {
        const container = document.querySelector('.profile-container');
        container.classList.remove('edit-mode');
        document.querySelectorAll('.profile-table .text-input, .profile-table select.text-input').forEach(function(input) {
            input.disabled = true;
            input.style.display = 'none'; // Hide input
            var span = input.nextElementSibling;
            span.style.display = 'block'; // Show span
            span.textContent = span.getAttribute('data-value'); // Display the actual value instead of the Thymeleaf expression
            // 这一行会将输入框的值重置为其在 data-original-value 属性中的原始值
            input.value = input.getAttribute('data-original-value');
        });
        document.querySelector('.edit-button').style.display = 'inline';
        document.querySelector('.save-button').style.display = 'none';
        document.querySelector('.cancel-button').style.display = 'none';
    }

</script>
</body>
</html>
