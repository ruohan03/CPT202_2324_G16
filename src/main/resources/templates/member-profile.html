<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${member.name} + ': Profile'">Profile</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="member-nav :: top-nav"></div>

<!-- Profile Container -->
<div class="profile-container">
    <h1 class="profile-header">Member Profile</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/member/update/{memberId}(memberId=${member.memberId})}" th:object="${member}" method="post">
        <table class="profile-table">
            <tr>
                <th>ID</th>
                <td th:text="${member.memberId}"></td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <span class="text-display" th:text="${member.name}"></span>
                    <input type="text" th:field="*{name}" class="text-input" disabled>
                </td>
            </tr>
            <tr>
                <th>Phone</th>
                <td th:text="${member.phone}"></td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <!-- Add a class for easy selection and initially hide it with inline style -->
                    <span class="text-display gender-display" th:text="${member.gender}"></span>
                    <!-- Remove th:if and th:unless -->
                    <select th:field="*{gender}" class="text-input gender-select" style="display: none;">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Address</th>
                <td>
                    <span class="text-display" th:text="${member.address}"></span>
                    <input type="text" th:field="*{address}" class="text-input" disabled>
                </td>
            </tr>
            <tr>
                <th>Weight (kg)</th>
                <td>
                    <span class="text-display" th:text="${member.weight} + ' kg'"></span>
                    <input type="text" th:field="*{weight}" class="text-input" disabled>
                </td>
            </tr>
            <tr>
                <th>Height (cm)</th>
                <td>
                    <span class="text-display" th:text="${member.height} + ' cm'"></span>
                    <input type="text" th:field="*{height}" class="text-input" disabled>
                </td>
            </tr>
        </table>
        <div class="button-container">
            <button type="button" onclick="enableEdit()" class="edit-button">Edit</button>
            <button type="submit" class="save-button" style="display: none;">Save</button>
            <button type="button" class="cancel-button" style="display: none;" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>

<script>
    function enableEdit() {
        const container = document.querySelector('.profile-container');
        container.classList.add('edit-mode');
        document.querySelectorAll('.profile-table .text-input').forEach(function(input) {
            input.disabled = false;
        });

        // 显示性别的下拉菜单并隐藏文本显示
        const genderSelect = document.querySelector('select[name="gender"]');
        const genderTextDisplay = document.querySelector('.text-display.gender');

        if (genderSelect) {
            genderSelect.disabled = false;
            genderSelect.style.display = 'block';
        }
        if (genderTextDisplay) {
            genderTextDisplay.style.display = 'none';
        }

        document.querySelector('.edit-button').style.display = 'none';
        document.querySelector('.save-button').style.display = 'inline';
        document.querySelector('.cancel-button').style.display = 'inline';
    }

    function cancelEdit() {
        const container = document.querySelector('.profile-container');
        container.classList.remove('edit-mode');
        document.querySelectorAll('.profile-table .text-input').forEach(function(input) {
            input.disabled = true;
        });

        // 隐藏性别的下拉菜单并显示文本
        const genderSelect = document.querySelector('select[name="gender"]');
        const genderTextDisplay = document.querySelector('.text-display.gender');

        if (genderSelect) {
            genderSelect.disabled = true;
            genderSelect.style.display = 'none';
        }
        if (genderTextDisplay) {
            genderTextDisplay.style.display = 'block';
        }

        document.querySelector('.edit-button').style.display = 'inline';
        document.querySelector('.save-button').style.display = 'none';
        document.querySelector('.cancel-button').style.display = 'none';
    }
</script>
</body>
</html>
