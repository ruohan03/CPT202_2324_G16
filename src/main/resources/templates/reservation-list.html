<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation List</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.js"></script>
    <style>
        table th, table td {
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container-scroller">
    <div th:replace="manager-nav.html"></div>
    <div class="main-panel">
        <div class="content-wrapper">
            <h2 class="center-text" >Reservation List</h2>
            <table id="reservationTable" class="table-hover">
                <thead>
                    <tr>
                        <th >Reservation ID </th>
                        <th >Member ID </th>
                        <th >Staff ID </th>
                        <th>Lesson Start Date</th>
                        <th >Time</th>
                        <th>Cancelled </th>
                        <th>Sign-in </th>
                    </tr>
                </thead>
                <tbody>
                <!-- Iterate through reservations and display each row -->
                <!-- Assuming 'reservations' is a list of Reservation objects passed from the controller -->
                <!-- You may need to adjust the property names based on your actual Reservation class -->
                <th:block th:each="reservation : ${reservationList}">
                    <tr>
                        <td th:text="${reservation.reservationId}"></td>
                        <td th:text="${reservation.memberId}"></td>
                        <td th:text="${reservation.staffId}"></td>
                        <td th:text="${reservation.lessonStartDate}"></td>
                        <td th:text="${reservation.lessonStartTime}+' - '+${reservation.lessonEndTime}"></td>
                        <td th:text="${reservation.isCancelled ? 'Yes' : 'No'}"></td>
                        <td th:text="${reservation.isSignIn ? 'Yes' : 'No'}"></td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
        <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
                <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
            </div>
        </footer>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#reservationTable').DataTable();
    });
</script>
</body>
</html>
