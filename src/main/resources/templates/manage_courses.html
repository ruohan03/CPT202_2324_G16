<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Course</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.js"></script>
    <style>
        #add-course-button {
            position: absolute;
            top: 60px;
            right: 50px;
            z-index: 100; /* Ensure the button is above other elements */
            border-radius: 50%; /* Make the button round */
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
            padding: 0; /* Remove padding */
            text-align: center; /* Center the content */
        }
    </style>
</head>
<body>
<div class="container-scroller">
    <div th:replace="manager-nav.html"></div>
    <div class="main-panel">
        <div class="content-wrapper">
            <button type="button" class="btn btn-inverse-info" id="add-course-button">
                <span class="mdi mdi-account-plus-outline"></span>
            </button>
            <h1>Available Courses</h1>

            <table id="courseTable" class="table-hover">
                <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Active</th> <!-- 新增显示激活状态的列 -->
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${not #lists.isEmpty(courses)}" th:each="course : ${courses}">
                    <td th:text="${course.courseId}"></td>
                    <td th:text="${course.name}"></td>
                    <td th:text="${course.location}"></td>
                    <td th:text="${course.active ? 'Yes' : 'No'}"></td> <!-- 在这里显示激活状态 -->
                    <td>
                        <a th:href="@{/edit_course/{courseId}(courseId=${course.courseId})}">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Add Course Modal -->
            <div id="add-course-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-body">
                        <button type="button" class="close" onclick="closeModal()">
                            <span aria-hidden="true">&times;</span>
                        </button>
                        <div id="add-course-form">
                           <div class="col-md-12 grid-margin stretch-card">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="card-title">Add Course</h4>
                                        <p class="card-description">
                                            New Course Information
                                        </p>
                                        <form th:action="@{/add_course}" method="post" class="form-horizontal">
                                            <div class="form-group row">
                                                <label for="courseId" class="col-sm-3 col-form-label">Course ID</label>
                                                <div class="col-sm-9">
                                                    <input type="text" name="courseId" class="form-control" id="courseId" placeholder="Course ID">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="name" class="col-sm-3 col-form-label">Course Name</label>
                                                <div class="col-sm-9">
                                                    <input type="text" name="name" class="form-control" id="name" placeholder="Course Name">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="location" class="col-sm-3 col-form-label">Location</label>
                                                <div class="col-sm-9">
                                                    <input type="text" name="location" class="form-control" id="location" placeholder="Location">
                                                </div>
                                            </div>
                                            <div style="display: flex; justify-content: space-between;">
                                                <button type="submit" class="btn btn-info mr-2">Submit</button>
                                                <button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${errorMessage}" class="error-message">
                <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${successMessage}">
                <span th:text="${successMessage}"></span>
            </div>
        </div>
        <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
                <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
            </div>
        </footer>
    </div>
</div>
<script src="/js/manage-course.js"></script>
<script th:if="${#lists.isEmpty(courses)}">
    $(document).ready(function(){
        alert("This course is not yet available");
    });
</script>

</body>
</html>
