<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Course</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        .search-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        input[type="text"], button {
            padding: 10px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .alert, .alert-danger {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
            background-color: #f2dede;
            color: #a94442;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div th:replace="back.html :: backButton"></div>
<h1>Available Courses</h1>

<div class="search-container">
    <form th:action="@{/manage_courses}" method="get" class="search-form">
        <input type="text" name="search" placeholder="Search by course ID or name" class="search-input">
        <button type="submit" class="search-button">Search</button>
    </form>
    <div th:if="${noSearchMessage}" class="alert alert-danger" th:text="${noSearchMessage}"></div>
</div>

<table>
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Active</th> <!-- 新增显示激活状态的列 -->
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${not #lists.isEmpty(courses)}" th:each="course : ${courses}">
        <td th:text="${course.courseId}"></td>
        <td th:text="${course.name}"></td>
        <td th:text="${course.location}"></td>
        <td th:text="${course.active ? 'Yes' : 'No'}"></td> <!-- 在这里显示激活状态 -->

        <td>
            <a th:href="@{/delete_course/{id}(id=${course.courseId})}">Delete</a>
            <a th:href="@{/edit_course/{courseId}(courseId=${course.courseId})}">Edit</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="add-course-container">
    <button type="button" class="add-course-button" onclick="showAddCourseForm()">Add Course</button>
</div>

<div id="add-course-form" style="display: none;">
    <form th:action="@{/add_course}" method="post" class="add-course-form">
        <input type="text" name="courseId" placeholder="Course ID" class="add-course-input">
        <input type="text" name="name" placeholder="Course Name" class="add-course-input">
        <input type="text" name="location" placeholder="Location" class="add-course-input">
        <button type="submit" class="add-course-button">Submit</button>
    </form>
</div>

<script th:inline="javascript">
    function showAddCourseForm() {
        var addCourseForm = document.getElementById('add-course-form');
        if (addCourseForm.style.display === 'none') {
            addCourseForm.style.display = 'block';
        } else {
            addCourseForm.style.display = 'none';
        }
    }
</script>

<div th:if="${errorMessage}" class="error-message">
    <span th:text="${errorMessage}"></span>
</div>

<div th:if="${successMessage}">
    <span th:text="${successMessage}"></span>
</div>

<script th:if="${#lists.isEmpty(courses)}">
    $(document).ready(function(){
        alert("This course is not yet available");
    });
</script>

</body>
</html>
