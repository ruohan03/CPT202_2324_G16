<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1 th:text="'Hello, Thymeleaf!'"></h1>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="trainer : ${trainers}">
                <td th:text="${trainer.trainerId}"></td>
                <td th:text="${trainer.name}"></td>
                <td th:text="${trainer.phone}"></td>

            </tr>
        </tbody>
    </table>
</body>
</html>
