<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Homepage</title>
    <!-- 引入 Bootstrap CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dashboard-header h2 {
            margin-top: 100px; /* 顶部边距 */
            text-align: center; /* 文字居中 */
        }
        .list-group-item {
            text-align: center; /* 列表项文字居中 */
        }
        .container{
            margin: auto!important;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
<div class="container-scroller">
    <nav class="top-nav">
        <div class="text-center navbar-brand-wrapper d-flex align-items-center justify-content-center">
            <a href="/staff/homepage" class="logo">H-XYZ | 打击代写就现在</a>
        </div>
        <div class="nav-right">
            <span class = "mdi mdi-account" th:text="${staffName}"></span>
            <li class="nav-item nav-logout d-none d-lg-block">
                <a class="nav-link" href="/staff/login">
                    <i class="mdi mdi-login-variant"></i>
                </a>
            </li>
            </d>
        </div>
    </nav>
    <div class="container">
        <div class="content-wrapper">
            <div class="dashboard-header">
                <h2>Welcome, <span th:text="${staffName}">Trainer</span></h2>
                <p>This is your dashboard. Use the links below to manage your activities.</p>
            </div>
            <div class="list-group">
                <a href="/staff/profile" class="list-group-item list-group-item-action">Personal Information</a>
                <a href="/staff/view_schedule" class="list-group-item list-group-item-action">View Schedule</a>
            </div>
        </div>
    </div>
</div>
<footer class="footer">
    <div class="d-sm-flex justify-content-center justify-content-sm-between">
        <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
    </div>
</footer>
<!-- 引入 Bootstrap 和 jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</html>
