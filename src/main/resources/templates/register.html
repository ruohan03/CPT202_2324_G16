<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Register</h1>
    <form th:action="@{/register}" th:object="${member}" method="post">
        <div>
            <input type="text" id="name" th:field="*{name}" placeholder="Name" />
        </div>
        <div>
            <input type="text" id="phone" th:field="*{phone}" placeholder="Phone" required />
        </div>
        <div>
            <input type="password" id="password" th:field="*{password}" placeholder="Password" pattern="^(?=.*[0-9])(?=.*[a-zA-Z]).{5,}$" title="Password must be at least 5 characters long and include both letters and numbers."/>
        </div>
        <button type="submit">Register</button>
    </form>
    <div th:if="${error}">
        <p class="error" th:text="${error}"></p>
    </div>
</div>
</body>
</html>
