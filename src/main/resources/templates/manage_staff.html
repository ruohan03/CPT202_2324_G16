<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Staff</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.js"></script>
    <style>
        #add-staff-button {
            position: absolute;
            top: 60px;
            right: 50px;
            z-index: 100; /* Ensure the button is above other elements */
            border-radius: 50%; /* Make the button round */
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
            padding: 0; /* Remove padding */
            text-align: center; /* Center the content */
        }
    </style>
</head>

<div class="container-scroller">
    <div th:replace="manager-nav.html"></div>
        <div class="main-panel">
            <div class="content-wrapper">
                <button type="button" class="btn btn-inverse-info" id="add-staff-button">
                    <span class="mdi mdi-account-plus-outline"></span>
                </button>
                <h1 >Staff Management</h1>
                <!-- Add Staff Modal -->
                <div id="add-staff-modal" class="modal">
                    <div class="modal-content">
                        <div class="modal-body">
                            <button type="button" class="close" onclick="closeModal()">
                                <span aria-hidden="true">&times;</span>
                            </button>
                            <div id="add-staff-form">
                                <div class="col-12 grid-margin">
                                    <div class="card">
                                        <div class="card-body">
                                            <h4 class="card-title">Add staff</h4>
                                            <p class="card-description">
                                                New Staff Information
                                            </p>
                                            <form th:action="@{/add_staff}" method="post" class="forms-sample">
                                                <div class="row">
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label">Staff ID</label>
                                                            <div class="col-sm-9">
                                                                <input type="text" name="staffId" placeholder="Staff ID" class="form-control form-control-sm" required aria-label="Username">
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label">Name</label>
                                                            <div class="col-sm-9">
                                                                <input type="text" name="name" placeholder="name" class="form-control form-control-sm" required>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label"> Password </label>
                                                            <div class="col-sm-9">
                                                                <input type="text" name="password" placeholder="password" class="form-control form-control-sm" required>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label"> phone </label>
                                                            <div class="col-sm-9">
                                                                <input type="text" name="phone" placeholder="phone" class="form-control form-control-sm" required>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label"> Gender </label>
                                                            <div class="col-sm-9">
                                                                    <select name="gender" class="form-control form-control-sm" required>
                                                                        <option value="">Select Gender</option>
                                                                        <option value="Male">Male</option>
                                                                        <option value="Female">Female</option>
                                                                    </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label"> Level</label>
                                                            <div class="col-sm-9">
                                                                <select name="level" class="form-control form-control-sm" required>
                                                                    <option value="">Select Level</option>
                                                                    <option value="3">3</option>
                                                                    <option value="4">4</option>
                                                                    <option value="5">5</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label"> Salary </label>
                                                            <div class="col-sm-9">
                                                                <input type="text" name="salary" placeholder="salary" class="form-control form-control-sm" required>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-md-6">
                                                        <div class="form-group row">
                                                            <label class="col-sm-3 col-form-label"> CourseId </label>
                                                            <div class="col-sm-9">
                                                                <input type="text" name="courseId" placeholder="CourseID" class="form-control form-control-sm" required>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <button type="submit" class="btn btn-info mr-2">Submit</button>
                                                <button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button>
                                                </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 员工信息表格 -->
                <table id="staffTable" class="table-hover">
                    <thead>
                    <tr>
                        <th>Staff ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Level</th>
                        <th>Salary</th>
                        <th>CourseId</th>
                        <th>Active</th> <!-- 新增显示激活状态的列 -->
                        <th>Actions</th>
                <!--        <th>Password</th>-->
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="staff : ${staff}">
                        <td th:text="${staff.staffId}">T003</td>
                        <td th:text="${staff.name}">Mary</td>
                        <td th:text="${staff.phone}">278227</td>
                        <td th:text="${staff.gender}">Female</td>
                        <td th:text="${staff.level}">5</td>
                        <td th:text="${staff.salary}">100000</td>
                        <td th:text="${staff.courseId}">C001</td>
                        <td th:text="${staff.active ? 'Yes' : 'No'}"></td> <!-- 在这里显示激活状态 -->
                        <td>
                            <a th:href="@{/edit_staff/{staffId}(staffId=${staff.staffId})}">Edit</a>
                        </td>
                    </tr>
                    <tr th:if="${staff.isEmpty()}">
                        <td colspan="5">No trainers found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <footer class="footer">
                <div class="d-sm-flex justify-content-center justify-content-sm-between">
                    <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
                </div>
            </footer>
        </div>
    </div>
</div>

<script src="/js/add-staff.js"></script>
</body>
</html>
