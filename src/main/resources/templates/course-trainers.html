<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Trainers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
            color: #333;
        }
        h1 {
            color: #026e99;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #026e99;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
        .back-button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #026e99;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .back-button:hover {
            background-color: #014f6e;
        }
    </style>
</head>
<body>
<h1>Trainers for the Course</h1>
<div>
    <h2 th:text="${courseName}">Course Name</h2>
    <table>
        <thead>
        <tr>
            <th>Trainer ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Gender</th>
            <th>Level</th>
            <th>Salary</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="trainer : ${trainers}">
            <td th:text="${trainer.trainerId}">T001</td>
            <td th:text="${trainer.name}">John Doe</td>
            <td th:text="${trainer.phone}">1234567890</td>
            <td th:text="${trainer.gender}">Male</td>
            <td th:text="${trainer.level}">5</td>
            <td th:text="${trainer.salary}">5000</td>
        </tr>
        </tbody>
    </table>
</div>
<a href="/courses" class="back-button">Back to Courses</a>
</body>
</html>
