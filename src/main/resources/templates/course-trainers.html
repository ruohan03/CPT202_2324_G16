<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Trainers</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h1>Trainers for the Course</h1>
<div>
    <h2 th:text="${courseName}">Course Name</h2>
    <table>
        <thead>
        <tr>
            <th>Trainer ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Gender</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="trainer : ${trainers}">
            <td th:text="${trainer.trainerId}">T001</td>
            <td th:text="${trainer.name}">John Doe</td>
            <td th:text="${trainer.phone}">1234567890</td>
            <td th:text="${trainer.gender}">Male</td>
        </tr>
        </tbody>
    </table>
</div>
<a href="/courses" class="back-button">Back to Courses</a>
</body>
</html>
