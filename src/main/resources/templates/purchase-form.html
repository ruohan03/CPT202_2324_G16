<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchase Form</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</head>
<body th:data-member-id="${session.memberId}">

<div th:replace="member-nav.html :: top-nav"></div>

<!-- Purchase Form Container -->
<div class="profile-container">
    <h1 class="profile-header">Purchase Plan</h1>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-danger" th:text="${error}"></div>
    <form th:action="@{/purchase}" th:object="${purchase}" method="post">
        <table class="profile-table">
            <tr>
                <th>Plan</th>
                <td>
                    <select th:field="*{plan}" class="select-input" onchange="updatePrice(this.value)">
                        <option value="">Please select a plan</option>
                        <option value="Diamond Super VIP">Diamond Super VIP - 12 Months</option>
                        <option value="Gold Super VIP">Gold Super VIP - 12 Months</option>
                        <option value="Silver Super VIP">Silver Super VIP - 12 Months</option>
                        <option value="Diamond VIP">Diamond VIP - 6 Months</option>
                        <option value="Gold VIP">Gold VIP - 6 Months</option>
                        <option value="Silver VIP">Silver VIP - 6 Months</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Price</th>
                <td id="planPrice"></td>
            </tr>
            <tr>
                <th>Purchase Date</th>
                <td>
                    <span th:text="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}">[Today's Date]</span>
                    <input type="hidden" th:field="*{purchaseDate}" th:value="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}">
                </td>
            </tr>
            <tr>
                <th>Duration (Months)</th>
                <td>
                    <input type="text" th:field="*{duration}" class="text-input always-visible" id="durationField" readonly>
                </td>
            </tr>
        </table>
        <div class="button-container">
            <button type="submit" class="save-button">Submit</button>
            <button type="button" class="cancel-button" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>
<footer class="bg-dark text-white mt-4">
    <div class="container py-3">
        <div class="row">
            <div class="col-md-6">
                <h5>Contact Us</h5>
                <address>
                    <strong>Fitness Center Inc.</strong><br>
                    123 Fitness Blvd.<br>
                    Wellness City, 98765<br>
                    <abbr title="Phone">P:</abbr> (123) 456-7890
                </address>
            </div>
            <div class="col-md-6">
                <h5>Follow Us</h5>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white">Twitter</a></li>
                    <li><a href="#" class="text-white">Facebook</a></li>
                    <li><a href="#" class="text-white">Instagram</a></li>
                </ul>
            </div>
        </div>
    </div>
</footer>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const errorMessage = document.querySelector('.alert-danger');
        if (errorMessage) {
            setTimeout(() => {
                errorMessage.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
            }, 3000); // 设置延时为 5000 毫秒（5 秒）
        }    document.addEventListener("DOMContentLoaded", function() {
            const successMessage = document.querySelector('.alert-success');
            if (successMessage) {
                setTimeout(() => {
                    successMessage.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
                }, 3000); // 设置延时为 5000 毫秒（5 秒）
            }
        });
    });
</script>
<script src="/js/member-purchase.js"></script>
<script src="/js/nav-book-course.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</body>
</html>
