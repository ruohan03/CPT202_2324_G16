<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchase Form</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

<div th:replace="member-nav :: top-nav"></div>

<!-- Purchase Form Container -->
<div class="profile-container">
    <h1 class="profile-header">Purchase Plan</h1>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-danger" th:text="${error}"></div>
    <form th:action="@{/purchase}" th:object="${purchase}" method="post">
        <table class="profile-table">
            <tr>
                <th>Plan</th>
                <td>
                    <select th:field="*{plan}" class="select-input" onchange="updatePrice(this.value)">
                        <option value="">Please select a plan</option>
                        <option value="Diamond Super VIP">Diamond Super VIP - 12 Months</option>
                        <option value="Gold Super VIP">Gold Super VIP - 12 Months</option>
                        <option value="Silver Super VIP">Silver Super VIP - 12 Months</option>
                        <option value="Diamond VIP">Diamond VIP - 6 Months</option>
                        <option value="Gold VIP">Gold VIP - 6 Months</option>
                        <option value="Silver VIP">Silver VIP - 6 Months</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Price</th>
                <td id="planPrice"></td>
            </tr>
            <tr>
                <th>Purchase Date</th>
                <td>
                    <span th:text="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}">[Today's Date]</span>
                    <input type="hidden" th:field="*{purchaseDate}" th:value="${#dates.format(new java.util.Date(), 'yyyy-MM-dd')}">
                </td>
            </tr>
            <tr>
                <th>Duration (Months)</th>
                <td>
                    <input type="text" th:field="*{duration}" class="text-input always-visible" id="durationField" readonly>
                </td>
            </tr>
        </table>
        <div class="button-container">
            <button type="submit" class="save-button">Submit</button>
            <button type="button" class="cancel-button" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>

<script>
    function updatePrice(plan) {
        const prices = {
            "Diamond Super VIP": 8888,
            "Gold Super VIP": 6888,
            "Silver Super VIP": 3888,
            "Diamond VIP": 5666,
            "Gold VIP": 3666,
            "Silver VIP": 1666
        };
        document.getElementById('planPrice').textContent = prices[plan] || "Please select a plan";
    }

    document.querySelector('select[name="plan"]').addEventListener('change', function() {
        updatePrice(this.value);
        const durationField = document.getElementById('durationField');
        if (this.value.includes('Super VIP')) {
            durationField.value = 12;  // 12 months for VIP plans
        } else if (this.value.includes('VIP')) {
            durationField.value = 6;   // 6 months for Member plans
        } else {
            durationField.value = '';  // clear if nothing selected or recognized
        }
    });

    function cancelEdit() {
        window.location.href = '/home_page'; // Redirect to home page on cancel
    }

    document.addEventListener("DOMContentLoaded", function() {
        const success = document.querySelector('.alert-success');
        if (success) {
            setTimeout(() => {
                success.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
            }, 3000); // 设置延时为 5000 毫秒（5 秒）
        }
    });
    document.addEventListener("DOMContentLoaded", function() {
        const error = document.querySelector('.alert-danger');
        if (error) {
            setTimeout(() => {
                error.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
            }, 3000); // 设置延时为 5000 毫秒（5 秒）
        }
    });
</script>
</body>
</html>
