<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Lessons</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.css">
    <style>
        .content-wrapper {
            flex: 1;
            margin: 0 !important;
            padding: 0 !important;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        footer {
            margin-top: auto;
        }
        .center-content {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="content-wrapper">
    <div th:replace="trainer-nav.html"></div>
    <div class="container">
        <div class="content-body center-content">
            <div class="col-lg-10 grid-margin stretch-card d-flex">
                <div class="card">
                    <div class="card-body">
                        <h3 class="text-center" style="margin-top:-10px ">Upcoming Lessons</h3>
                        <H4 th:if="${staffReservationList.isEmpty()}" class="text-danger">No Upcoming Lesson</H4>
                        <table id="schedules" class="table table-hover" th:if="${!staffReservationList.isEmpty()}">
                            <thead>
                            <tr>
                                <th>Reservation ID</th>
                                <th>Member ID</th>
                                <th>Lesson Time</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Iterate through reservations and display each row -->
                            <!-- Assuming 'reservations' is a list of Reservation objects passed from the controller -->
                            <!-- You may need to adjust the property names based on your actual Reservation class -->
                            <th:block th:each="reservation : ${staffReservationList}">
                                <tr>
                                    <td th:text="${reservation.reservationId}"></td>
                                    <td th:text="${reservation.memberId}"></td>
                                    <td th:text="${reservation.lessonStartDate} + '    '+ ${reservation.lessonStartTime} + ' - ' + ${reservation.lessonEndTime}"></td>
                                    <!-- Sign In Button Form -->
                                    <td>
                                        <span class="text-danger" th:if="${!reservation.isSignIn && !reservation.isCancelled && (reservation.lessonStartDate.isAfter(T(java.time.LocalDate).now()) || (reservation.lessonStartDate.isEqual(T(java.time.LocalDate).now()) && reservation.lessonStartTime.isAfter(T(java.time.LocalTime).now())))}">Not within sign-in time</span>
                                        <form th:unless="${reservation.isSignIn || reservation.isCancelled || (reservation.lessonStartDate.isBefore(T(java.time.LocalDate).now()) || (reservation.lessonStartDate.isEqual(T(java.time.LocalDate).now()) && (T(java.time.LocalTime).now().isBefore(reservation.lessonStartTime) || T(java.time.LocalTime).now().isAfter(reservation.lessonEndTime))))}" th:action="'/sign_in/' + ${reservation.reservationId}" method="post" style="margin: 0">
                                            <button type="submit" class="btn btn-sm btn-success mdi mdi-calendar-multiple-check">Sign In</button>
                                        </form>

                                    </td>
                                </tr>
                            </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="footer">
    <div class="d-sm-flex justify-content-center justify-content-sm-between">
        <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
    </div>
</footer>
<script type="text/javascript" charset="utf8" src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.js"></script>
<script>
    $(document).ready(function() {
        $('#schedules').DataTable();
    });
</script>
</body>
</html>
