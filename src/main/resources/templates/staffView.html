<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        thead {
            background-color: #f2f2f2;
            color: #333;
        }
        tbody tr:hover {
            background-color: #f9f9f9;
        }
        .password {
            cursor: pointer; /* 鼠标指示可点击 */
            color: #999; /* 初始颜色为灰色 */
            transition: color 0.3s ease; /* 添加颜色过渡效果 */
        }
        .password:hover {
            color: #333; /* 鼠标悬停时颜色变为黑色 */
        }
    </style>
</head>
<body>
<h1>Staff List</h1>
<table>
    <thead>
    <tr>
        <th>Staff ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Gender</th>
        <th>Level</th>
        <th>Salary</th>
        <th>Course ID</th>
        <th>Is Manager</th>
        <th>Password</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="staff : ${staff}">
        <td th:text="${staff.staffId}">ID</td>
        <td th:text="${staff.name}">Name</td>
        <td th:text="${staff.phone}">Phone</td>
        <td th:text="${staff.gender}">Gender</td>
        <td th:text="${staff.level != null ? staff.level : 'N/A'}">Level</td>
        <td th:text="${staff.salary != null ? staff.salary : 'N/A'}">Salary</td>
        <td th:text="${staff.courseId}">Course ID</td>
        <td th:text="${staff.isManager ? 'Yes' : 'No'}">Is Manager</td>
        <!-- 密码列，添加了隐藏/显示功能 -->
        <td><span class="password" th:text="${staff.password}">Password</span></td>
    </tr>
    </tbody>
</table>

<script>
    var passwordSpans = document.querySelectorAll('.password');

    passwordSpans.forEach(function(span) {
        var originalPassword = span.textContent;
        span.textContent = '*'.repeat(originalPassword.length);

        span.addEventListener('click', function() {
            if (span.textContent === '*'.repeat(originalPassword.length)) {
                span.textContent = originalPassword;
            } else {
                span.textContent = '*'.repeat(originalPassword.length);
            }
        });
    });
</script>
</body>
</html>
