<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Member Management</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.js"></script>
    <script src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.min.js"></script>
    <style>
        table th, table td {
            text-align: center;
        }
        .form-no-padding {
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="container-scroller">
    <div th:replace="manager-nav.html"></div>
    <div class="main-panel">
        <div class="content-wrapper">
            <h1 class="text-center">Member Management</h1>
            <!-- 显示错误消息 -->
            <div th:if="${noSearchMessage}" th:text="${noSearchMessage}" style="color: red;"></div>
            <!-- 显示所有用户的表格 -->
            <table id="memberTable" class="table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Plan</th>
                        <th>Remaining Sum</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="member : ${members}"> <!-- 注意这里改为绑定 `members` 变量 -->
                        <td th:text="${member.memberId}"></td>
                        <td th:text="${member.name}"></td>
                        <td th:text="${member.phone}"></td>
                        <td th:text="${member.plan}"></td>
                        <td th:text="${member.remaining_sum}"></td> <!-- 确保使用正确的属性名 -->
                        <td>
                            <!-- 充值按钮触发模态框或新页面 -->
                            <form th:action="@{/recharge-member}" method="post" class="form-no-padding"> <!-- 确保这个路径与控制器中定义的路径相匹配 -->
                                <input type="hidden" th:value="${member.memberId}" name="memberId">
                                <div class="input-group d-flex" >
                                    <input type="number" name="amount" placeholder="Enter amount"  class="form-control-sm" required>
                                    <div class="input-group-append">
                                        <button type="submit" class="btn btn-sm btn-gradient-success"><span class="mdi mdi mdi-check"></span></button>
                                    </div>
                                </div>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
                <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Fitness Appointment System.</span>
            </div>
        </footer>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="/js/manager-nav.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function() {
        $('#memberTable').DataTable();
    });
</script>

</body>
</html>
