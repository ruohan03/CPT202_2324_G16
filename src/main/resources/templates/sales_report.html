<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Report</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
    <style>
        .container, .container-fluid, .container-lg, .container-md, .container-sm, .container-xl {
            padding-left: 0;
        }
    </style>
</head>
<body>
<div class="container-scroller">
    <div th:replace="~{manager-nav.html}"></div>
    <div class="main-panel">
        <div class="content-wrapper">
            <div style="margin-top: 20px;">
                <div class="page-header">
                    <h2>Sales Report</h2>
                </div>
                <div class="row">
                    <div class="col-lg-6 grid-margin stretch-card">
                        <div class="card">
                            <div class="card-body">
                                <table class="table table-hover" id="salesTable">
                                    <h3 class="card-title">Sales data</h3>
                                    <p class="card-description">All Plan Sales Data</p>
                                    <thead>
                                    <tr>
                                        <th>Plan</th>
                                        <th>Total Sales</th>
                                        <th>Sales Count</th>
                                    </tr>
                                    </thead>
                                    <tbody th:each="entry : ${salesData}">
                                    <tr>
                                        <td th:text="${entry.key}"></td>
                                        <td th:text="${entry.value.totalSales}"></td>
                                        <td th:text="${entry.value.count}"></td>
                                    </tr>
                                    </tbody>
                                    <tfoot>
                                    <tr>
                                        <th>All Plan Sales</th>
                                        <th th:text="${totalSales}">[Total Sales]</th>
                                        <th th:text="${totalCount}">[Total Count]</th>
                                    </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 grid-margin stretch-card">
                        <div class="card">
                            <div class="card-body">
                                <h3>Sales Distribution by Plan</h3>
                                <div class="chart-container">
                                    <canvas id="salesChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-12">
                    <h3>Daily Sales Over Time</h3>
                    <div class="chart-container">
                        <canvas id="dailySalesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
                <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Fitness Appointment System.</span>
            </div>
        </footer>
    </div>
</div>

<script th:inline="javascript">

    /*<![CDATA[*/
    // Setup for the pie chart
    var ctxPie = document.getElementById('salesChart').getContext('2d');
    var salesData = /*[[${salesData}]]*/ {};
    var labelsPie = Object.keys(salesData);
    var dataPie = labelsPie.map(label => salesData[label].count);

    // Define the colors
    var colors = [
        'rgba(255, 99, 132, 0.5)',
        'rgba(54, 162, 235, 0.5)',
        'rgba(255, 206, 86, 0.5)',
        'rgba(75, 192, 192, 0.5)',
        'rgba(153, 102, 255, 0.5)',
        'rgba(255, 159, 64, 0.5)'
    ];

    var borderColors = [
        'rgba(255,99,132,1)',
        'rgba(54, 162, 235, 1)',
        'rgba(255, 206, 86, 1)',
        'rgba(75, 192, 192, 1)',
        'rgba(153, 102, 255, 1)',
        'rgba(255, 159, 64, 1)'
    ];

    new Chart(ctxPie, {
        type: 'pie',
        data: {
            labels: labelsPie,
            datasets: [{
                label: 'Sales Count',
                data: dataPie,
                backgroundColor: colors,
                borderColor: borderColors,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
    /*]]>*/

    // Setup for the line chart
    var ctxLine = document.getElementById('dailySalesChart').getContext('2d');
    var dailySalesData = /*[[${dailySalesData}]]*/ {};
    var labelsLine = Object.keys(dailySalesData).sort();
    var datasetsLine = [];

    // Generate one dataset per plan
    var colorIndex = 0;
    labelsPie.forEach(plan => {
        var dataLine = labelsLine.map(date => dailySalesData[date][plan] ? dailySalesData[date][plan].totalSales : 0);
        datasetsLine.push({
            label: plan,
            data: dataLine,
            borderColor: borderColors[colorIndex],
            fill: false
        });
        colorIndex = (colorIndex + 1) % colors.length;  // Cycle through the colors
    });

    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: labelsLine,
            datasets: datasetsLine
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'day',
                        tooltipFormat: 'll',
                        displayFormats: {
                            day: 'YYYY-MM-DD'
                        }
                    },
                    scaleLabel: {
                        display: true,
                        labelString: 'Date'
                    }
                },
                y: {
                    scaleLabel: {
                        display: true,
                        labelString: 'Sales ($)'
                    }
                }
            }
        }
    });


</script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="/js/manager-nav.js"></script>
</body>
</html>
