<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forget Password</title>
  <link rel="stylesheet" href="/css/ForgetPassword.css">
  <!-- Include necessary CSS framework -->


</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">H-XYZ Fitness Appointment System</div>
  </div>
  <a href="/staff/login" class="nav-button">Return</a>
</nav>

<div class="container">
  <h2>Forget Password</h2>
  <form action="/forgetPassword_trainer" method="post">
    <div>

      <input type="text" id="phone" name="phone" placeholder="Phone number" required>
    </div>
    <div>

      <input type="text" id="name" name="name" placeholder="Name" required>
    </div>
    <div>

      <input type="password" id="newPassword" name="newPassword" placeholder="New password"required>
    </div>
    <div id="passwordError" style="color: red; display: none;">Password must contain at least one letter and one number, and be at least 5 characters long.</div>
    <div>
      <button type="submit" class="btn">Submit</button>
    </div>
  </form>
  <div id="message" style="color: green;"></div>
  <!-- Display error message -->
  <div th:if="${errorMessage}" style="color: red;">
    <span th:text="${errorMessage}"></span>
  </div>
  <!-- Display success message -->
  <div th:if="${successMessage}" style="color: green;">
    <span th:text="${successMessage}"></span>
  </div>
</div>

<!-- JavaScript code for password validation and form submission -->
</body>
</html>
