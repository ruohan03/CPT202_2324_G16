<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forget Password</title>

  <!-- Include necessary CSS framework -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      transition: border-color 0.3s ease;
    }
    input:focus {
      border-color: #007bff;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    #passwordError {
      margin-top: 10px;
    }
    .error-message {
      color: red;
      margin-top: 10px;
    }
    .success-message {
      color: green;
      margin-top: 10px;
    }
  </style>

</head>
<body>
<div class="container">
  <h2>Forget Password</h2>
  <form action="/forgetPassword_trainer" method="post">
    <div>

      <input type="text" id="phone" name="phone" placeholder="Phone number" required>
    </div>
    <div>

      <input type="text" id="name" name="name" placeholder="Name" required>
    </div>
    <div>

      <input type="password" id="newPassword" name="newPassword" placeholder="New password"required>
    </div>
    <div id="passwordError" style="color: red; display: none;">Password must contain at least one letter and one number, and be at least 5 characters long.</div>
    <div>
      <button type="submit">Submit</button>
    </div>
  </form>
  <div id="message" style="color: green;"></div>
  <!-- Display error message -->
  <div th:if="${errorMessage}" style="color: red;">
    <span th:text="${errorMessage}"></span>
  </div>
  <!-- Display success message -->
  <div th:if="${successMessage}" style="color: green;">
    <span th:text="${successMessage}"></span>
  </div>
</div>

<!-- JavaScript code for password validation and form submission -->
</body>
</html>
