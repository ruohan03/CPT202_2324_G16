<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="top-nav">
    <a href="/home_page" class="logo">H-XYZ | 打击代写就现在</a>
    <div class="nav-center">
        <a href="/home_page" th:class="${currentPage == 'home'} ? 'current-page' : ''">Home</a>
        <a href="/member/order/course" th:class="${currentPage == 'bookCourse'} ? 'current-page' : ''">Book Course</a>
        <a href="/member/profile" th:class="${currentPage == 'memberProfile' ? 'current-page':''}">My Profile</a>
        <a href="/member/update-password" th:class="${currentPage == 'changePassword' ? 'current-page':''}">Update Password</a>
        <a href="/purchase/new" th:class="${currentPage == 'purchaseForm' ? 'current-page' : ''}">Buy Plans</a>

        <!-- ... other links ... -->
    </div>
    <div class="nav-right">
        <span th:text="${isLoggedIn ? member.name : 'Visitor'}"></span>
        <a th:if="${isLoggedIn}" href="/logout" class="logout-button">Logout</a>
        <a th:if="${!isLoggedIn}" href="/login" class="login-button">Login</a>
    </div>
</div>

<div class="container">
    <h1>Available Courses</h1>
    <table>
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Location</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}"
            th:attr="onclick=|console.log('Redirecting to /select-coach/' + '${course.courseId}'); window.location.href='/select-coach/' + '${course.courseId}';|" >
            <td th:text="${course.name}"></td>
            <td th:text="${course.location}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
