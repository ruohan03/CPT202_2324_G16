<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="member-nav :: top-nav"></div>

<div class="container">
    <h1>Available Courses</h1>
    <table>
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Location</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}"
            th:attr="onclick=|console.log('Redirecting to /member/select-coach/' + '${course.courseId}'); window.location.href='/select-coach/' + '${course.courseId}';|" >
            <td th:text="${course.name}"></td>
            <td th:text="${course.location}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
