<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Course</title>
  <link rel="stylesheet" href="/css/template.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">

</head>
<body>
<div class="container-scroller">
  <div th:replace="manager-nav.html"></div>
  <div class="main-panel">
    <div class="content-wrapper">
      <div class="row">
        <div class="col-md-6 grid-margin stretch-card">
          <div class="card">
            <div class="card-body">
                <h4 class="card-title">Edit Course</h4>
                <p class="card-description">
                    Edit course details
                </p>
                <form class="forms-sample" th:action="@{'/edit_course/' + ${course.courseId}}" method="post">
                  <div class="form-group row">
                    <label for="courseCode" class="col-sm-3 col-form-label">Course Code</label>
                    <div class="col-sm-9">
                      <input type="text" class="form-control" id="courseCode" name="courseCode" placeholder="Course Code" th:value="${course.courseId}"readonly>
                    </div>
                  </div>
                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Course Name</label>
                        <div class="col-sm-9">
                            <input type="text" name="name" placeholder="Course Name" th:value="${course.name}" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group row">
                      <label class="col-sm-3 col-form-label">Location</label>
                      <div class="col-sm-9">
                        <input type="text" name="location" placeholder="Location" th:value="${course.location}" class="form-control" required>
                      </div>
                    </div>
                  <div class="form-group row">
                    <label class="col-sm-3 col-form-label">
                      <input type="checkbox" name="isActive" th:checked="${course.active}">
                      Active
                    </label>
                  </div>
                  <button type="submit" class="btn btn-gradient-info">Update</button>
                </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
