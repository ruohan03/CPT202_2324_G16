<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Course</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Add your custom CSS styles here */
  </style>
</head>
<body>
<div class="title">
  <h1>Edit Course</h1>
</div>

<div class="edit-course-container">
  <form th:action="@{'/edit_course/' + ${course.courseId}}" method="post" class="edit-course-form">
    <input type="hidden" name="courseId" th:value="${course.courseId}">
    <input type="text" name="name" placeholder="Course Name" th:value="${course.name}" class="edit-course-input">
    <input type="text" name="location" placeholder="Location" th:value="${course.location}" class="edit-course-input">
    <button type="submit" class="edit-course-button">Update Course</button>
  </form>
</div>

</body>
</html>
