<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Purchases</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .back-button {
            position: fixed; /* 固定位置，始终可见 */
            top: 20px; /* 距离顶部20px */
            left: 20px; /* 距离左侧20px */
        }
    </style>
</head>
<body>
<div th:replace="back.html :: backButton"></div>
<div class="back-button">
    <a href="/manager-homepage" class="button">Return to Dashboard</a> <!-- 修改链接指向你的管理主页 -->
</div>
<div class="container">
    <h1>All Purchases</h1>

    <!-- 错误消息显示部分 -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <table border="1">
        <thead>
        <tr>
            <th>Purchase ID</th>
            <th>Member ID</th>
            <th>Member Name</th>
            <th>Plan</th>
            <th>Purchase Date</th>
            <th>Cost</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="purchase : ${purchases}">
            <td th:text="${purchase.purchaseId}"></td>
            <td th:text="${purchase.member.memberId}"></td>
            <td th:text="${purchase.member.name}"></td>
            <td th:text="${purchase.plan}"></td>
            <td th:text="${#dates.format(purchase.purchaseDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${purchase.cost}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
