<!-- member-nav.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Navigation Fragment</title>
</head>
<body>

<div th:fragment="top-nav">
    <div class="top-nav">
        <a href="/home_page" class="logo">H-XYZ | 打击代写就现在</a>
        <div class="nav-center">
            <a href="/home_page" th:class="${currentPage == 'home'} ? 'current-page' : ''"><i class="mdi mdi-home menu-icon"></i></i>Home</a>
            <a href="/member/order/course"id="navBookCourseBtn"  th:class="${currentPage == 'bookCourse'} ? 'current-page':''">Book Course</a>
            <a href="/member/profile" th:class="${currentPage == 'memberProfile' ? 'current-page':''}" th:if="${isLoggedIn}">My Profile</a>
            <a href="/member/update-password" th:class="${currentPage == 'updatePassword' ? 'current-page':''}" th:if="${isLoggedIn}">Update Password</a>
            <a href="/purchase/new" th:class="${currentPage == 'purchaseForm' ? 'current-page':''}" th:if="${isLoggedIn}">Buy Plans</a>
            <a href="/member/incomplete" th:class="${currentPage == 'viewReservations' ? 'current-page':''}" th:if="${isLoggedIn}">My Lessons</a>
        </div>
        <div class="nav-right">
            <span class = "mdi mdi-account" th:text="${isLoggedIn ? member.name : 'Visitor'}"></span>
            <a th:if="${isLoggedIn}" href="/logout" class="logout-button"> <i class="mdi mdi-logout-variant"></i> Logout</a>
            <a th:if="${!isLoggedIn}" href="/login" class="login-button"><i class="mdi mdi-login-variant"></i> Login</a>
        </div>
    </div>
</div>

</body>
</html>
