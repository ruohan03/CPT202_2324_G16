<!-- member-nav.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Navigation Fragment</title>
</head>
<body>
<div th:fragment="top-nav">
    <div class="top-nav">
        <a href="/home_page" class="logo">H-XYZ | 打击代写就现在</a>
        <div class="nav-center">
            <a href="/home_page" th:class="${currentPage == 'home'} ? 'current-page' : ''">Home</a>
            <a id="navBookCourseBtn" href="/member/order/course" th:class="${currentPage == 'bookCourse'} ? 'current-page':''">Book Course</a>
            <a href="/member/profile" th:class="${currentPage == 'memberProfile' ? 'current-page':''}" th:if="${isLoggedIn}">My Profile</a>
            <a href="/member/update-password" th:class="${currentPage == 'changePassword' ? 'current-page':''}" th:if="${isLoggedIn}">Update Password</a>
            <a href="/purchase/new" th:class="${currentPage == 'newPurchase' ? 'current-page':''}" th:if="${isLoggedIn}">Buy Plans</a>
        </div>
        <div class="nav-right">
            <span th:text="${isLoggedIn ? member.name : 'Visitor'}"></span>
            <a th:if="${isLoggedIn}" href="/logout" class="logout-button">Logout</a>
            <a th:if="${!isLoggedIn}" href="/login" class="login-button">Login</a>
        </div>
    </div>
</div>
</body>
</html>
