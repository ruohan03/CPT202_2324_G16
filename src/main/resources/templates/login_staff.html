<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- 可选的 Bootstrap 主题 -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap-theme.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 400px;
            margin: auto;
            padding-top: 50px;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <h2 class="text-center">Staff Login</h2>
        <!-- 显示错误消息的区域 -->
        <div id="error-message" class="error" style="display: none;">Invalid credentials. Please try again.</div>
        <form action="/login/staff" method="post">  <!-- 确保action的URL正确 -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
    </div>
</div>
<script>
    // 检查URL中是否有错误参数，如果有，显示错误消息
    if (window.location.search.indexOf('error=true') !== -1) {
        document.getElementById('error-message').style.display = 'block';
    }
</script>
</body>
</html>
