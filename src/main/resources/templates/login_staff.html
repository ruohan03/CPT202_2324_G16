<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-centered-container">
    <div class="login-form">
        <h1>Staff Login</h1>
        <!-- 显示错误消息的区域 -->
        <div id="error-message" class="error-message" style="display: none;">Invalid credentials. Please try again.</div>
        <form action="/staff/login" method="post">  <!-- 确保action的URL正确 -->
            <div class="form-group">
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone number" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</div>
<script>
    // 检查URL中是否有错误参数，如果有，显示错误消息
    if (window.location.search.indexOf('error=true') !== -1) {
        document.getElementById('error-message').style.display = 'block';
    }
</script>
</body>
</html>
