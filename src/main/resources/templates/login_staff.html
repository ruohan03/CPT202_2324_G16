<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="stylesheet" href="/css/Login.css">
</head>
<body>
<nav class="navbar">
    <div class="navbar-brand">H-XYZ Fitness Appointment System</div>
    <a href="/navigation" class="nav-button">Return</a>
</nav>
<div class="login-centered-container">
    <div class="login-form">
        <h1>Staff Login</h1>
        <!-- 显示错误消息的区域 -->
        <div id="error-message" class="error-message" style="display: none;">Invalid credentials. Please try again.</div>
        <div id="inactive-account-message" class="error-message" style="display: none;">Account not active. Please contact administrator.</div>

        <form action="/staff/login" method="post">
            <div class="form-group">
                <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone number" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <div id="registerOption">
                <a href="/forgetPassword_staff">Forget Password?</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Check the URL for error parameters and display the corresponding error message
    const urlParams = new URLSearchParams(window.location.search);
    const errorType = urlParams.get('error');
    if (errorType === 'true') {
        document.getElementById('error-message').style.display = 'block';
    } else if (errorType === 'inactive') {
        document.getElementById('inactive-account-message').style.display = 'block';
    }

    document.addEventListener("DOMContentLoaded", function() {
        const successMessage = document.querySelector('.success-message');
        if (successMessage) {
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 5000); // Hide the success message after 5 seconds
        }
    });
</script>

</body>
</html>
