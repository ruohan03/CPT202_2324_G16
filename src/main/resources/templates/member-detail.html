<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Details</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<div class="member-profile-container">
    <h1 class="member-profile-header">Member Profile</h1>
    <table class="member-profile-table">
        <tr>
            <th>ID</th>
            <td th:text="${member.memberId}"></td>
        </tr>
        <tr>
            <th>Name</th>
            <td th:text="${member.name}"></td>
        </tr>
        <tr>
            <th>Phone</th>
            <td th:text="${member.phone}"></td>
        </tr>
        <tr>
            <th>Gender</th>
            <td th:text="${member.gender}"></td>
        </tr>
        <tr>
            <th>Address</th>
            <td th:text="${member.address}"></td>
        </tr>
        <tr>
            <th>Weight</th>
            <td th:text="${member.weight}"></td>
        </tr>
        <tr>
            <th>Height</th>
            <td th:text="${member.height}"></td>
        </tr>
    </table>
</div>

<!-- Same JavaScript to handle password visibility -->
<script>
    var passwordSpan = document.querySelector('.password');
    var originalPassword = passwordSpan.textContent;
    passwordSpan.textContent = '*'.repeat(originalPassword.length);
    passwordSpan.addEventListener('click', function() {
        if (passwordSpan.textContent === '*'.repeat(originalPassword.length)) {
            passwordSpan.textContent = originalPassword;
        } else {
            passwordSpan.textContent = '*'.repeat(originalPassword.length);
        }
    });
</script>
</body>
</html>
