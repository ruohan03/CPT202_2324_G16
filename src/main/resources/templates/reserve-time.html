<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>选择时间</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <style>
        .no-border {
            border: none !important;
        }
    </style>
</head>
<body>

    <div class="top-nav" th:replace="member-nav :: top-nav"></div>

    <form th:action="@{/member/confirm-reservation}" method="post">
        <input type="hidden" id="memberId" name="memberId" th:value="${member.memberId}" />
        <input type="hidden" id="staffId" name="staffId" th:value="${staffId}" />
        <input type="hidden" id="courseId" name="courseId" th:value="${selectedCourseId}" />
        <label for="date">Please select date：</label>
        <input type="hidden" name="time" value="" />
        <input type="date" id="date" name="date" required onchange="fetchAvailability()"/>
        <div id="availabilityResults"></div>
        <!-- 在JavaScript中处理选择的时间段 -->
    </form>

    <!-- Modal -->
    <div class="modal fade" id="reservationModal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">预约时间冲突</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    您在选择的时间段内已有预约。<br>
                    请关闭此窗口并选择其他时间。
                </div>
                <div class="modal-footer no-border justify-content-center">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            today.setDate(today.getDate() + 1);
            const nextWeek = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 7);
            const datePicker = document.getElementById('date');
            datePicker.min = today.toISOString().split('T')[0];
            datePicker.max = nextWeek.toISOString().split('T')[0];

            function fetchAvailability() {
                const staffId = document.querySelector('input[name="staffId"]').value;
                const date = datePicker.value;
                if (date) {
                    $.ajax({
                        url: '/api/check-time/' + staffId + '?date=' + date,
                        type: 'GET',
                        success: function(data) {
                            const results = document.getElementById('availabilityResults');
                            results.innerHTML = '';
                            const timeSlots = ['09:00-11:00', '11:00-13:00', '13:00-15:00', '15:00-17:00', '17:00-19:00', '19:00-21:00'];
                            timeSlots.forEach((slot, i) => {
                                const button = document.createElement('button');
                                button.type = 'button'; // Keep it as 'button' to prevent form submission
                                button.className = `time-slot ${data[i] ? 'available' : 'unavailable'}`;
                                button.textContent = slot;
                                button.disabled = !data[i];
                                button.onclick = () => checkForExistingReservation(slot);
                                results.appendChild(button);
                            });
                        }
                    });
                }
            }

            function checkForExistingReservation(time) {
                const [startTime, endTime] = time.split('-');
                const memberId = document.querySelector('input[name="memberId"]').value;
                const selectedDate = datePicker.value;
                $.ajax({
                    url: `/api/has-reservation/${memberId}`,
                    data: { date: selectedDate, startTime: startTime, endTime: endTime },
                    type: 'GET',
                    success: function(hasReservation) {
                        if (hasReservation) {
                            // If there is a reservation, show the modal
                            $('#reservationModal').modal('show');
                        } else {
                            // If there is no existing reservation, submit the form with the selected time
                            document.querySelector('input[name="time"]').value = time;
                            document.querySelector('form').submit();
                        }
                    },
                    error: function() {
                        alert('检查现有预约时发生错误。');
                    }
                });
            }

            datePicker.onchange = fetchAvailability;
        });
    </script>

</body>
</html>
