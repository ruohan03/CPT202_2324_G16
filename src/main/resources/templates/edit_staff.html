<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Staff</title>
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.css">

</head>
<body>
<div class="container-scroller">
    <div th:replace="manager-nav.html"></div>
    <div class="main-panel">
        <div class="content-wrapper">
            <div class="col-12 grid-margin">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Edit Staff info</h4>
                        <p class="card-description">
                            Staff Information
                        </p>
                        <form th:action="@{'/edit_staff/' + ${staff.staffId}}" method="post" class="edit-staff-form">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label">Staff ID</label>
                                        <div class="col-sm-9">
                                            <input type="text" name="staffId" placeholder="Staff ID" th:value="${staff.staffId}" class="form-control form-control-sm" required aria-label="Staff ID">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label">Name</label>
                                        <div class="col-sm-9">
                                            <input type="text" name="name" placeholder="Name" th:value="${staff.name}" class="form-control form-control-sm" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label">Phone</label>
                                        <div class="col-sm-9">
                                            <input type="text" name="phone" placeholder="Phone" th:value="${staff.phone}" class="form-control form-control-sm" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label"> Gender </label>
                                        <div class="col-sm-9">
                                            <select name="gender" class="form-control form-control-sm" required>
                                                <option value="">Select Gender</option>
                                                <option value="Male" th:selected="${staff.gender == 'Male'}">Male</option>
                                                <option value="Female" th:selected="${staff.gender == 'Female'}">Female</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label"> Level</label>
                                        <div class="col-sm-9">
                                            <select name="level" class="form-control form-control-sm" required>
                                                <option value="">Select Level</option>
                                                <option value="3" th:selected="${staff.level == 3}">3</option>
                                                <option value="4" th:selected="${staff.level == 4}">4</option>
                                                <option value="5" th:selected="${staff.level == 5}">5</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label"> Salary </label>
                                        <div class="col-sm-9">
                                            <input type="text" name="salary" placeholder="salary" th:value="${staff.salary}" class="form-control form-control-sm" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group row">
                                        <label class="col-sm-3 col-form-label"> CourseId </label>
                                        <div class="col-sm-9">
                                            <input type="text" name="courseId" placeholder="CourseID" th:value="${staff.courseId}" class="form-control form-control-sm" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Checkbox for Active Status -->
                            <div>
                                <label>
                                    <input type="checkbox" name="isActive" th:checked="${staff.active}"> Active Status
                                </label>
                            </div>

                            <button type="submit" class="btn btn-gradient-info">Update</button>
                            <button type="button" class="btn btn-gradient-dark" onclick="window.location.href='/manage_staff'">Cancel</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
                <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
            </div>
        </footer>
    </div>
</div>

</body>
</html>
