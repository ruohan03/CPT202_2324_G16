<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Staff</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Add your custom CSS styles here */
    </style>
</head>
<body>
<div class="title">
    <h1>Edit Staff</h1>
</div>

<div class="edit-staff-container">
    <form th:action="@{'/edit_staff/' + ${staff.staffId}}" method="post" class="edit-staff-form">
        <input type="hidden" name="staffId" th:value="${staff.staffId}">
        <input type="text" name="name" placeholder="name" th:value="${staff.name}" class="edit-staff-input">
        <input type="text" name="password" placeholder="password" th:value="${staff.password}" class="edit-staff-input">
        <input type="text" name="phone" placeholder="phone" th:value="${staff.phone}" class="edit-staff-input">
        <input type="text" name="gender" placeholder="gender" th:value="${staff.gender}" class="edit-staff-input">
        <input type="text" name="level" placeholder="level" th:value="${staff.level}" class="edit-staff-input">
        <input type="text" name="salary" placeholder="salary" th:value="${staff.salary}" class="edit-staff-input">
        <input type="text" name="courseId" placeholder="courseId" th:value="${staff.courseId}" class="edit-staff-input">
        <button type="submit" class="edit-syaff-button">Update Staff</button>
    </form>
</div>

</body>
</html>
