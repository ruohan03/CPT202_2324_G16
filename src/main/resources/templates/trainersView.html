<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trainers List</title>
    <!-- 引入Bootstrap CSS 使表格样式更美观 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">
    <h1>Trainers List</h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Gender</th>
            <th>Level</th>
            <th>Salary</th>
            <th>Course ID</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="trainer : ${trainers}">
            <td th:text="${trainer.trainerId}">ID</td>
            <td th:text="${trainer.name}">Name</td>
            <td th:text="${trainer.phone}">Phone</td>
            <td th:text="${trainer.gender}">Gender</td>
            <td th:text="${trainer.level}">Level</td>
            <td th:text="${trainer.salary}">Salary</td>
            <td th:text="${trainer.courseId}">Course ID</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
