<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/updatePassword.css">
</head>
<body>
<!-- Navigation Bar -->
<div class="top-nav">
    <a href="/home_page" class="logo">H-XYZ | 打击代写就现在</a>
    <div class="nav-center">
        <a href="/home_page" th:class="${currentPage == 'home' ? 'current-page':''}">Home</a>
        <a href="/member/profile" th:class="${currentPage == 'memberProfile' ? 'current-page':''}">My Profile</a>
        <a href="/member/update-password" th:class="${currentPage == 'changePassword' ? 'current-page':''}">Update Password</a>
    </div>
    <div class="nav-right">
        <span th:text="${member.name}"></span>
        <a href="/logout" class="active">Logout</a>
    </div>
</div>

<div class="update-password-container">
    <h1>Change Password</h1>
    <!-- 显示错误消息 -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <form th:action="@{/member/update-password}" method="post">
        <div class="form-group">
            <label for="oldPassword"></label><input type="password" id="oldPassword" name="oldPassword" placeholder="Current Password">
        </div>
        <div class="form-group">
            <label for="newPassword"></label><input type="password" id="newPassword" name="newPassword" placeholder="New Password" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword"></label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
        </div>
        <button type="submit" class="btn save-button">Submit</button>
    </form>
</div>
</body>
</html>
