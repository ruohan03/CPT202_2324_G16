<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/updatePassword.css">
</head>
<body th:data-member-id="${session.memberId}">
<div th:replace="member-nav.html :: top-nav"></div>

<div class="update-password-container">
    <h1>Change Password</h1>
    <!-- 显示错误消息 -->
    <div th:if="${error}" class="alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <form th:action="@{/member/update-password}" method="post">
        <div class="form-group">
            <label for="oldPassword"></label><input type="password" id="oldPassword" name="oldPassword" placeholder="Current Password">
        </div>
        <div class="form-group">
            <label for="newPassword"></label><input type="password" id="newPassword" name="newPassword" placeholder="New Password" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword"></label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
        </div>
        <button type="submit" class="btn save-button">Submit</button>
    </form>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
    const errorMessage = document.querySelector('.alert-danger');
    if (errorMessage) {
        setTimeout(() => {
            errorMessage.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
        }, 3000); // 设置延时为 5000 毫秒（5 秒）
    }
    document.addEventListener("DOMContentLoaded", function() {
            const successMessage = document.querySelector('.alert-success');
            if (successMessage) {
                setTimeout(() => {
                    successMessage.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
                }, 3000); // 设置延时为 5000 毫秒（5 秒）
            }
        });
});

</script>
<script src="/js/nav-book-course.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</body>
</html>
