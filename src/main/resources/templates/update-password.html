<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</head>
<body th:data-member-id="${session.memberId}">

<div class="content-wrap">
    <div th:replace="member-nav.html :: top-nav"></div>
    <div class="content-body">
        <div class="profile-container">
            <h1 class="profile-header">Change Password</h1>
            <!-- 显示错误消息 -->
            <div th:if="${error}" class="alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert-success" th:text="${success}"></div>
            <form th:action="@{/member/update-password}" method="post">
                <table class="profile-table">
                    <tr>
                        <th> Current password</th>
                        <td>
                            <input type="password" id="oldPassword" name="oldPassword" placeholder="Current Password">
                        </td>
                    </tr>
                    <tr>
                        <th>New Password</th>
                        <td>
                            <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required>
                        </td>
                    </tr>
                    <tr>
                        <th>Confirm New Password</th>
                        <td>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
                        </td>

                    </tr>
                </table>
                <button type="submit" class="save-button">Submit</button>
                <button type="button" class="cancel-button" onclick="cancelEdit()">Cancel</button>
            </form>
        </div>
    </div>
    <footer class="bg-dark text-white mt-4">
        <div class="container py-3">
            <div class="row">
                <div class="col-md-6">
                    <h5>Contact Us</h5>
                    <address>
                        <strong>Fitness Center Inc.</strong><br>
                        123 Fitness Blvd.<br>
                        Wellness City, 98765<br>
                        <abbr title="Phone">P:</abbr> (123) 456-7890
                    </address>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-white">Twitter</a></li>
                        <li><a href="#" class="text-white">Facebook</a></li>
                        <li><a href="#" class="text-white">Instagram</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</div>


<script src="/js/update-password.js"></script>
<script src="/js/nav-book-course.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</body>
</html>
