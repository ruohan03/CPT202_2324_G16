<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/ForgetPassword.css">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">H-XYZ Fitness Appointment System</div>
    </div>
    <a href="/login" class="nav-button">Return</a>
</nav>

<div class="container">
    <h2>Forgot Password</h2>
    <div th:if="${errorMessage}" class="error-message">
    <span th:text="${errorMessage}"></span>
    </div>
        <form id="forgotPasswordForm" action="/forgot-password" method="post">
        <div class="mb-3">
            <div class="form-label">
                <input type="text" id="phone" name="phone" class="form-control" required placeholder="Phone number">
            </div>
        </div>
        <div class="mb-3">
            <div class="form-label">
                <input type="text" id="username" name="username" class="form-control" required placeholder="Username">
            </div>
        </div>
        <div class="mb-3">
            <div class="form-label">
                <input type="password" id="newPassword" name="newPassword" class="form-control" required placeholder="New password">
            </div>
        </div>
        <div class="mb-3">
            <button type="submit" class="btn">Submit</button>
        </div>



    </form>
</div>
</body>
</html>
