<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/ForgetPassword.css">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">H-XYZ Fitness Appointment System</div>
    <div class="nav-right">
        <a href="/login" class="nav-button">Return</a>
    </div>
</nav>

<div class="container">
    <h2>Forgot Password</h2>
    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}"></span>
    </div>
    <form id="forgotPasswordForm" action="/forgot-password" method="post">
        <div class="mb-3">
            <input type="text" id="phone" name="phone" class="form-control" required placeholder="Phone number">
        </div>
        <div class="mb-3">
            <input type="text" id="username" name="username" class="form-control" required placeholder="Username">
        </div>
        <div class="mb-3">
            <input type="email" id="email" name="email" class="form-control" required placeholder="Email">
        </div>
        <div class="mb-3">
            <input type="password" id="newPassword" name="newPassword" class="form-control" required placeholder="New password">
        </div>
        <div class="mb-3">
            <input type="text" id="verificationCode" name="verificationCode" class="form-control" required placeholder="Verification Code">
        </div>
        <div class="mb-3">
            <button type="button" class="btn" onclick="sendVerificationCode()">Send Verification Code</button>
        </div>
        <div class="mb-3">
            <button type="submit" class="btn">Submit</button>
        </div>
    </form>
</div>

<script>
    function sendVerificationCode() {
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        if (email && phone) {
            fetch('/sendForgotPasswordCode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}`
            })
                .then(response => response.json())  // 确保将响应解析为JSON
                .then(data => {
                    alert(data.message);  // 显示返回的消息
                })
                .catch(error => {
                    alert('Error sending verification code: ' + error);
                });
        } else {
            alert('Please fill in the email and phone fields.');
        }
    }

</script>

</body>
</html>
