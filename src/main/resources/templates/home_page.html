<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${member != null ? member.name + ' : Profile' : 'Fitness Center'}">Fitness Center</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .welcome-message {
            text-align: center;
            font-size: 2.5rem; /* 大号字体 */
            color: #333;
            margin-top: 20px; /* 顶部边距 */
        }
    </style>
</head>
<body>
<div class="top-nav">
    <a href="/home_page" class="logo">H-XYZ | 打击代写就现在</a>
    <div class="nav-center">
        <a href="/home_page" th:class="${currentPage == 'home'} ? 'current-page' : ''">Home</a>
        <a href="/member/profile" th:class="${currentPage == 'memberProfile' ? 'current-page':''}" th:if="${isLoggedIn}">My Profile</a>
        <a href="/member/update-password" th:class="${currentPage == 'changePassword' ? 'current-page':''}" th:if="${isLoggedIn}">Update Password</a>
        <!-- ... other links ... -->
    </div>
    <div class="nav-right">
        <span th:text="${isLoggedIn ? member.name : 'Visitor'}"></span>
        <a th:if="${isLoggedIn}" href="/logout" class="logout-button">Logout</a>
        <a th:if="${!isLoggedIn}" href="/login" class="login-button">Login</a>
    </div>
</div>

<div th:if="${welcomeMessage}" class="welcome-message" th:text="${welcomeMessage}"></div>
<div th:if="${error}" class="error-message" th:text="${error}"></div>

<div class="jumbotron">
    <div class="container text-center">
        <p class="lead">Let's stay healthy and vibrant together!</p>
        <a class="btn btn-primary btn-lg" href="other/course_type.html" role="button">Book a Course</a>
    </div>
</div>

<script>
    // 添加页面滚动事件，以改变导航栏背景
    window.onscroll = function() {
        if (window.scrollY > 50) {
            document.querySelector('.navbar').classList.add('scrolled');
        } else {
            document.querySelector('.navbar').classList.remove('scrolled');
        }
    };
</script>
<footer class="bg-dark text-white mt-4">
    <div class="container py-3">
        <div class="row">
            <div class="col-md-6">
                <h5>Contact Us</h5>
                <address>
                    <strong>Fitness Center Inc.</strong><br>
                    123 Fitness Blvd.<br>
                    Wellness City, 98765<br>
                    <abbr title="Phone">P:</abbr> (123) 456-7890
                </address>
            </div>
            <div class="col-md-6">
                <h5>Follow Us</h5>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white">Twitter</a></li>
                    <li><a href="#" class="text-white">Facebook</a></li>
                    <li><a href="#" class="text-white">Instagram</a></li>
                </ul>
            </div>
        </div>
    </div>
</footer>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var memberId = sessionStorage.getItem('memberId'); // 假设在登录时已存储
        var profileLink = document.getElementById('profile-link');
        if (profileLink && memberId) {
            profileLink.href = `/profile/${memberId}`;
        }
    });
</script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
