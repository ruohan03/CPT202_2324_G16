<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${member != null ? member.name + ' : Profile' : 'Fitness Center'}">Fitness Center</title>
    <link rel="stylesheet" href="/css/H-XYZ.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <style>
        .welcome-message {
            text-align: center;
            font-size: 2.5rem; /* 大号字体 */
            color: #333;
            margin-top: 20px; /* 顶部边距 */
        }
    </style>
</head>
<body th:data-member-id="${session.memberId}">

    <div th:replace="member-nav.html :: top-nav"></div>

    <section class="hero">
        <div class="container">
            <div class="text-content text-center">
                <div th:if="${welcomeMessage}" class="welcome-message" th:text="${welcomeMessage}"></div>
                <div th:if="${renewalMessage}" class="alert alert-warning" th:text="${renewalMessage}"></div>
                <div th:if="${error}" class="error-message" th:text="${error}"></div>
                <h1>Perfect Workout Coach For Body Shape</h1>
                <p class="lead">Let's stay healthy and vibrant together!</p>
            </div>
            <div class="image-content">
                <img src="../images/about-img.png" alt="Fitness Image">
            </div>
        </div>
    </section>


    <footer class="bg-dark text-white mt-4">
        <div class="container py-3">
            <div class="row">
                <div class="col-md-6">
                    <h5>Contact Us</h5>
                    <address>
                        <strong>Fitness Center Inc.</strong><br>
                        123 Fitness Blvd.<br>
                        Wellness City, 98765<br>
                        <abbr title="Phone">P:</abbr> (123) 456-7890
                    </address>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-white">Twitter</a></li>
                        <li><a href="#" class="text-white">Facebook</a></li>
                        <li><a href="#" class="text-white">Instagram</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="/js/homepage.js"></script>
    <script src="/js/nav-book-course.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</body>
</html>
