<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${member != null ? member.name + ' : Profile' : 'Fitness Center'}">Fitness Center</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <style>
        .welcome-message {
            text-align: center;
            font-size: 2.5rem; /* 大号字体 */
            color: #333;
            margin-top: 20px; /* 顶部边距 */
        }
    </style>
</head>
<body>

    <div th:replace="member-nav :: top-nav"></div>

    <div th:if="${welcomeMessage}" class="welcome-message" th:text="${welcomeMessage}"></div>
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <div class="jumbotron">
        <div class="container text-center">
            <p class="lead">Let's stay healthy and vibrant together!</p>
            <a class="btn btn-primary btn-lg" role="button" id="bookCourseBtn">Book a Course</a>
        </div>
    </div>

    <footer class="bg-dark text-white mt-4">
        <div class="container py-3">
            <div class="row">
                <div class="col-md-6">
                    <h5>Contact Us</h5>
                    <address>
                        <strong>Fitness Center Inc.</strong><br>
                        123 Fitness Blvd.<br>
                        Wellness City, 98765<br>
                        <abbr title="Phone">P:</abbr> (123) 456-7890
                    </address>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-white">Twitter</a></li>
                        <li><a href="#" class="text-white">Facebook</a></li>
                        <li><a href="#" class="text-white">Instagram</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var memberId = sessionStorage.getItem('memberId'); // 假设在登录时已存储
            var profileLink = document.getElementById('profile-link');
            if (profileLink && memberId) {
                profileLink.href = `/profile/${memberId}`;
            }
        });
    </script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const memberId = [[${session.memberId}]];
        /*]]>*/
    </script>

    <script>
            document.getElementById('bookCourseBtn').addEventListener('click', function() {
            if (memberId) {
                fetch(`/members/check-validity/${memberId}`)
                    .then(response => {
                        if (response.ok) {
                            window.location.href = '/member/order/course';
                        } else {
                            return response.text();
                        }
                    })
                    .then(message => {
                        if (message) {
                            let title = 'Member Status';
                            if (message === 'Something wrong happens, please connect with the administrator.') {
                                title = 'Error';
                            }
                            Swal.fire({
                                title: title,
                                text: message,
                                icon: 'error',
                                confirmButtonText: 'Close'
                            });
                        }
                    })
                    .catch(error => console.error('Error:', error));
            } else {
                Swal.fire({
                    title: 'Error',
                    text: 'Member ID is not available.',
                    icon: 'error',
                    confirmButtonText: 'Close'
                });
            }
        });

        document.getElementById('navBookCourseBtn').addEventListener('click', function(event) {
            event.preventDefault(); // 阻止默认的链接跳转行为
            if (memberId) {
                fetch(`/members/check-validity/${memberId}`)
                    .then(response => {
                        if (response.ok) {
                            window.location.href = '/member/order/course';
                        } else {
                            return response.text();
                        }
                    })
                    .then(message => {
                        if (message) {
                            let title = 'Member Status';
                            if (message === 'Something wrong happens, please connect with the administrator.') {
                                title = 'Error';
                            }
                            Swal.fire({
                                title: title,
                                text: message,
                                icon: 'error',
                                confirmButtonText: 'Close'
                            });
                        }
                    })
                    .catch(error => console.error('Error:', error));
            } else {
                Swal.fire({
                    title: 'Error',
                    text: 'Member ID is not available.',
                    icon: 'error',
                    confirmButtonText: 'Close'
                });
            }
        });
    </script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
