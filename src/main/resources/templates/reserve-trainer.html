<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Trainer</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="member-nav :: top-nav"></div>

    <form th:action="@{/member/select-time}" method="post">
        <input type="hidden" name="courseId" th:value="${selectedCourse.courseId}" />
        <div class="list-group">
            <div th:each="trainer : ${Trainers}" class="list-group-item">
                <span th:text="${trainer.name + ' - Level: ' + trainer.level}"></span>
                <button type="submit" name="staffId" th:value="${trainer.staffId}">Select</button>
            </div>
        </div>
    </form>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
