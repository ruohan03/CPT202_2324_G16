<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course List</title>
</head>
<body>
<h1>Course List</h1>
<table>
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Name</th>
        <th>Location</th>
    </tr>
    </thead>
    <tbody>
    <!-- Assuming courses is the list of courses passed from your Spring controller -->
    <!--/*@thymesVar id="Courses" type="aj"*/-->
    <tr th:each="course : ${courses}">
        <td th:text="${course.courseId}"></td>
        <td th:text="${course.name}"></td>
        <td th:text="${course.location}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
