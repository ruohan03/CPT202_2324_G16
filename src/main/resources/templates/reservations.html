<body>
<div class="container">
    <h1>Reservation List</h1>
    <table>
        <thead>
        <tr>
            <th>Reservation ID</th>
            <th>Member ID</th>
            <th>Staff ID</th>
            <th>Lesson Start Time</th>
            <th>Cancelled</th>
            <th>Sign-in</th>
        </tr>
        </thead>
        <tbody>
        <!-- Iterate through reservations and display each row -->
        <!-- Assuming 'reservations' is a list of Reservation objects passed from the controller -->
        <!-- You may need to adjust the property names based on your actual Reservation class -->
        <th:block th:each="reservation : ${reservations}">
            <tr>
                <td th:text="${reservation.reservation_id}"></td>
                <td th:text="${reservation.member_id}"></td>
                <td th:text="${reservation.staff_id}"></td>
                <td th:text="${reservation.lesson_starttime}"></td>
                <td th:text="${reservation.is_cancelled ? 'Yes' : 'No'}"></td>
                <td th:text="${reservation.is_signin ? 'Yes' : 'No'}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>
