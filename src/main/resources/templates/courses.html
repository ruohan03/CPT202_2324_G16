<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 jQuery 库 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
<h1>Available Courses</h1>

<form th:action="@{/courses}" method="get">
    <input type="text" name="search" placeholder="Search by course name">
    <button type="submit">Search</button>
</form>

<table>
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Name</th>
        <th>Location</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}"
        th:attr="onclick=|console.log('Redirecting to /courses/' + '${course.courseId}' + '/trainers'); window.location.href='/courses/' + '${course.courseId}' + '/trainers';|">
        <td th:text="${course.courseId}">C001</td>
        <td th:text="${course.name}">Yoga</td>
        <td th:text="${course.location}">Room A</td>
    </tr>
    </tbody>
</table>

<!-- JavaScript 代码，在搜索结果为空时显示弹窗 -->
<script th:if="${#lists.isEmpty(courses)}">
    $(document).ready(function(){
        alert("This course is not yet available");
    });
</script>
</body>
</html>
