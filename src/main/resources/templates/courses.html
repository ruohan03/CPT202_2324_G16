<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 jQuery 库 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        .search-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        /* 在这里添加自定义样式 */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s ease-in-out;
        }
        .alert-danger {
            max-width: 300px;
            color: #a94442;
            background-color: #f2dede;
            border-color: #ebccd1;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* 可以在这里添加更多样式 */
    </style>
</head>
<body>
<div class="title">
    <h1>Available Courses</h1>
</div>

<div class="search-container">
    <form th:action="@{/courses}" method="get" class="search-form">
        <input type="text" name="search" placeholder="Search by course name" class="search-input">
        <button type="submit" class="search-button">Search</button>
    </form>
    <!-- 添加提示消息 -->
    <div th:if="${noSearchMessage}" class="alert alert-danger" th:text="${noSearchMessage}" ></div>
</div>
<table>
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Name</th>
        <th>Location</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}"
        th:attr="onclick=|console.log('Redirecting to /courses/' + '${course.courseId}' + '/staff'); window.location.href='/courses/' + '${course.courseId}' + '/staff';|">
        <td th:text="${course.courseId}">C001</td>
        <td th:text="${course.name}">Yoga</td>
        <td th:text="${course.location}">Room A</td>
    </tr>
    </tbody>
</table>

<!-- JavaScript 代码，在搜索结果为空时显示弹窗 -->
<script th:if="${#lists.isEmpty(courses)}">
    $(document).ready(function(){
        alert("This course is not yet available");
    });
</script>
</body>
</html>
