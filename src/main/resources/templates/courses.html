<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- 引入 jQuery 库 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        .search-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        /* 在这里添加自定义样式 */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.3s ease-in-out;
        }
        .alert alert-danger {
            max-width: 300px;
            color: #a94442;
            background-color: #f2dede;
            border-color: #ebccd1;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* 可以在这里添加更多样式 */
        /* 定义动画 */
        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
                transform: translateY(-20px); /* 开始和结束时都向上移动，创建淡出效果 */
            }
            10%, 90% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>

<div class="title">
    <h1>Available Courses</h1>
</div>

<div class="search-container">
    <form th:action="@{/courses}" method="get" class="search-form">
        <input type="text" name="search" placeholder="Search by course ID or name" class="search-input">
        <button type="submit" class="search-button">Search</button>
    </form>
    <!-- 添加提示消息 -->
    <div th:if="${noSearchMessage}" class="alert-danger" th:text="${noSearchMessage}" ></div>
</div>
<table>
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Name</th>
        <th>Location</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}"
        th:attr="onclick=|console.log('Redirecting to /courses/' + '${course.courseId}' + '/staff'); window.location.href='/courses/' + '${course.courseId}' + '/staff';|">
        <td th:text="${course.courseId}">C001</td>
        <td th:text="${course.name}">Yoga</td>
        <td th:text="${course.location}">Room A</td>
    </tr>
    </tbody>
</table>

<!-- JavaScript 代码，在搜索结果为空时显示弹窗 -->
<script th:if="${#lists.isEmpty(courses)}">
    $(document).ready(function(){
        alert("This course is not yet available");
    });

    document.addEventListener("DOMContentLoaded", function() {
        const errorMessage = document.querySelector('.alert-danger');
        if (errorMessage) {
            setTimeout(() => {
                errorMessage.style.display = 'none'; // 或者 successMessage.remove(); 若希望从 DOM 中完全移除元素
            }, 3000); // 设置延时为 5000 毫秒（5 秒）
        }
    });
</script>
</body>
</html>
