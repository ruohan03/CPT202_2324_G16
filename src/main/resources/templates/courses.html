<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Available Courses</h1>

<form th:action="@{/courses}" method="get">
    <input type="text" name="search" placeholder="Search by course name">
    <button type="submit">Search</button>
</form>

<table>
    <thead>
    <tr>
        <th>Course ID</th>
        <th>Name</th>
        <th>Location</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}"
        th:attr="onclick=|console.log('Redirecting to /courses/' + '${course.courseId}' + '/staff'); window.location.href='/courses/' + '${course.courseId}' + '/staff';|">
        <td th:text="${course.courseId}">C001</td>
        <td th:text="${course.name}">Yoga</td>
        <td th:text="${course.location}">Room A</td>
    </tr>


    </tbody>
</table>
</body>
</html>
