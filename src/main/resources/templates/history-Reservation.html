<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Appointment</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
</head>
<style>
    .complete {
        font-size: 18px;
        background-color: #FFFFFF; /* White background on hover */
        color: #D51FBA; /* Pink text on hover */
        cursor: pointer; /* 鼠标悬停时显示手型图标 */
        border-radius: 4px; /* Rounded corners for the button */
        transition: background-color 0.3s;
        margin-top: 10px;
        outline: none;
    }
    .incomplete {
        font-size: 18px;
        background-color: #FFFFFF; /* White background on hover */
        color: #D51FBA; /* Pink text on hover */
        cursor: pointer; /* 鼠标悬停时显示手型图标 */
        border-radius: 4px; /* Rounded corners for the button */
        transition: background-color 0.3s; /* Smooth transition for hover effect */
        margin-top: 18px;
        outline: none;
    }

</style>
<body th:data-member-id="${session.memberId}">

<div th:replace="member-nav.html :: top-nav"></div>

<div class="container">
    <h1>History Appointment</h1>
    <a href="/incomplete"><button class="complete">Completed</button></a>
    <a href="/completed"><button class="incomplete">Incompleted</button></a>
    <table>
        <thead>
        <tr>
            <th>Appointment ID</th>
            <th>Member ID</th>
            <th>Staff ID</th>
            <th>Lesson Start Date</th>
            <th>Lesson Start Time</th>
            <th>Lesson End Time</th>
            <th>Cancelled</th>
            <th>Sign-in</th>
        </tr>
        </thead>
        <tbody>
        <!-- Iterate through reservations and display each row -->
        <th:block th:each="reservation : ${reservationList}">
            <tr>
                <td th:text="${reservation.reservationId}"></td>
                <td th:text="${reservation.memberId}"></td>
                <td th:text="${reservation.staffId}"></td>
                <td th:text="${reservation.lessonStartDate}"></td>
                <td th:text="${reservation.lessonStartTime}"></td>
                <td th:text="${reservation.lessonEndTime}"></td>
                <td th:text="${reservation.isCancelled ? 'Yes' : 'No'}"></td>
                <td th:text="${reservation.isSignIn ? 'Yes' : 'No'}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>
<footer class="bg-dark text-white mt-4">
    <div class="container py-3">
        <div class="row">
            <div class="col-md-6">
                <h5>Contact Us</h5>
                <address>
                    <strong>Fitness Center Inc.</strong><br>
                    123 Fitness Blvd.<br>
                    Wellness City, 98765<br>
                    <abbr title="Phone">P:</abbr> (123) 456-7890
                </address>
            </div>
            <div class="col-md-6">
                <h5>Follow Us</h5>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white">Twitter</a></li>
                    <li><a href="#" class="text-white">Facebook</a></li>
                    <li><a href="#" class="text-white">Instagram</a></li>
                </ul>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
