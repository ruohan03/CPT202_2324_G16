<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <link rel="stylesheet" href="/css/Navigation.css">
</head>
<body>
    <div class="container">
        <div class="column left">
            <div class="welcome-title">H-XYZ</div>
            <p>Welcome to Fitness Appointment system!</p>
            <p>Please log in to access your account:</p>
            <button onclick="window.location.href= '/login'" class="btn">Member Login</button>
        </div>
        <hr class="divider" />
        <div class="column right">
            <p>If you are a staff, please log in here:</p>
            <button onclick="window.location.href='/login/staff' " class="btn">Staff Login</button>
        </div>
    </div>
</body>
</html>
