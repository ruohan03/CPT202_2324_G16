<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Reservation List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Reservation List</h1>
    <table>
        <thead>
        <tr>
            <th>Reservation ID</th>
            <th>Member ID</th>
            <th>Staff ID</th>
            <th>Lesson Start Date</th>
            <th>Lesson Start Time</th>
            <th>Lesson End Time</th>
            <th>Cancelled</th>
            <th>Sign-in</th>
        </tr>
        </thead>
        <tbody>
        <!-- Iterate through reservations and display each row -->
        <!-- Assuming 'reservations' is a list of Reservation objects passed from the controller -->
        <!-- You may need to adjust the property names based on your actual Reservation class -->
        <th:block th:each="reservation : ${staffCompleteReservationList}">
            <tr>
                <td th:text="${reservation.reservationId}"></td>
                <td th:text="${reservation.memberId}"></td>
                <td th:text="${reservation.staffId}"></td>
                <td th:text="${reservation.lessonStartDate}"></td>
                <td th:text="${reservation.lessonStartTime}"></td>
                <td th:text="${reservation.lessonEndTime}"></td>
                <td th:text="${reservation.isCancelled ? 'Yes' : 'No'}"></td>
                <td th:text="${reservation.isSignIn ? 'Yes' : 'No'}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>
</body>
</html>
