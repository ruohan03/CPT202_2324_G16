<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Renewal Notifications</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .table-responsive {
            margin-bottom: 20px;
        }
        .header {
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="header">
        <h1>Renewal Notifications</h1>
        <form method="post" action="/admin/send-renewal-notifications">
            <button type="submit" class="btn btn-danger">Send Renewal Notifications</button>
        </form>
    </div>
    <div class="table-responsive">
        <h2>Members Nearing Expiry</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Name</th>
                <th>End Date</th>
            </tr>
            </thead>
            <tbody th:each="member : ${expiringMembers}">
            <tr>
                <td th:text="${member.name}"></td>
                <td th:text="${#dates.format(member.endDate, 'yyyy-MM-dd')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="table-responsive">
        <h2>Notified Members</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Name</th>
                <th>End Date</th>
                <th>Notification Sent</th>
            </tr>
            </thead>
            <tbody th:each="member : ${notifiedMembers}">
            <tr>
                <td th:text="${member.name}"></td>
                <td th:text="${#dates.format(member.endDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${member.renewalNotificationSent ? 'Yes' : 'No'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
