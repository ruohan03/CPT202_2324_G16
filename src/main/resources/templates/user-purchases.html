<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Purchases</title>
    <style>
        body {
            font-family: Arial, sans-serif; /* 使用无衬线字体，现代感强 */
            margin: 40px; /* 页面边距 */
            background-color: #f4f4f4; /* 背景颜色 */
        }
        h1 {
            color: #333; /* 标题颜色 */
        }
        table {
            width: 100%; /* 表格宽度 */
            border-collapse: collapse; /* 边框合并 */
        }
        th, td {
            border: 1px solid #ddd; /* 单元格边框 */
            padding: 8px; /* 单元格内边距 */
            text-align: left; /* 文本左对齐 */
        }
        th {
            background-color: #4CAF50; /* 表头背景颜色 */
            color: white; /* 表头文字颜色 */
        }
        tr:nth-child(even) {
            background-color: #f2f2f2; /* 间隔行背景颜色 */
        }

    </style>
</head>
<body>
<h1>Your Purchases</h1>
<table>
    <thead>
    <tr>
        <th>Purchase ID</th>
        <th>Plan</th>
        <th>Purchase Date</th>
        <th>Cost</th>
    </tr>
    </thead>
    <tbody th:each="purchase : ${purchases}">
    <tr>
        <td th:text="${purchase.purchaseId}"></td>
        <td th:text="${purchase.plan}"></td>
        <td th:text="${#dates.format(purchase.purchaseDate, 'yyyy-MM-dd')}"></td>
        <td th:text="${purchase.cost}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
