<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Purchases</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>Your Purchases</h1>
<table>
    <thead>
    <tr>
        <th>Purchase ID</th>
        <th>Plan</th>
        <th>Purchase Date</th>
        <th>Cost</th>
    </tr>
    </thead>
    <tbody th:each="purchase : ${purchases}">
    <tr>
        <td th:text="${purchase.purchaseId}"></td>
        <td th:text="${purchase.plan}"></td>
        <td th:text="${#dates.format(purchase.purchaseDate, 'yyyy-MM-dd')}"></td>
        <td th:text="${purchase.cost}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
