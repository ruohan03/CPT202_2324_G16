<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${staff.name} + ': Profile'">Profile</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navigation Bar -->
<div class="top-nav">
    <a href="/home_page" class="logo">H-XYZ | 打击代写就现在</a>
    <div class="nav-center">
        <a href="/home_page" th:class="${currentPage == 'home' ? 'current-page':''}">Home</a>
        <a href="/staff/profile" th:class="${currentPage == 'staffProfile' ? 'current-page':''}">My Profile</a>
    </div>
    <div class="nav-right">
        <span th:text="${staff.name}"></span>
        <a href="/logout" class="active">Logout</a>
    </div>
</div>

<!-- Profile Container -->
<div class="profile-container">
    <h1 class="profile-header">Staff Profile</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/staff/update/{staffId}(staffId=${staff.staffId})}" th:object="${staff}" method="post">
        <table class="profile-table">
            <tr>
                <th>ID</th>
                <td th:text="${staff.staffId}"></td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <span class="text-display" th:text="${staff.name}"></span>
                    <input type="text" th:field="*{name}" class="text-input" disabled>
                </td>
            </tr>
            <tr>
                <th>Phone</th>
                <td th:text="${staff.phone}"></td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <!-- Add a class for easy selection and initially hide it with inline style -->
                    <span class="text-display gender-display" th:text="${staff.gender}"></span>
                    <!-- Remove th:if and th:unless -->
                    <select th:field="*{gender}" class="text-input gender-select" style="display: none;">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Level</th>
                <td th:text="${staff.level}"></td>
            </tr>
            <tr>
                <th>Salary</th>
                <td th:text="${staff.salary}"></td>
            </tr>
            <tr>
                <th>Course ID</th>
                <td th:text="${staff.courseId}"></td>
            </tr>
        </table>
        <div class="button-container">
            <button type="button" onclick="enableEdit()" class="edit-button">Edit</button>
            <button type="submit" class="save-button" style="display: none;">Save</button>
            <button type="button" class="cancel-button" style="display: none;" onclick="cancelEdit()">Cancel</button>
        </div>
    </form>
</div>

<script>
    function enableEdit() {
        const container = document.querySelector('.profile-container');
        container.classList.add('edit-mode');
        document.querySelectorAll('.profile-table .text-input').forEach(function(input) {
            input.disabled = false;
        });

        // 显示性别的下拉菜单并隐藏文本显示
        const genderSelect = document.querySelector('select[name="gender"]');
        const genderTextDisplay = document.querySelector('.text-display.gender');

        if (genderSelect) {
            genderSelect.disabled = false;
            genderSelect.style.display = 'block';
        }
        if (genderTextDisplay) {
            genderTextDisplay.style.display = 'none';
        }

        document.querySelector('.edit-button').style.display = 'none';
        document.querySelector('.save-button').style.display = 'inline';
        document.querySelector('.cancel-button').style.display = 'inline';
    }

    function cancelEdit() {
        const container = document.querySelector('.profile-container');
        container.classList.remove('edit-mode');
        document.querySelectorAll('.profile-table .text-input').forEach(function(input) {
            input.disabled = true;
        });

        // 隐藏性别的下拉菜单并显示文本
        const genderSelect = document.querySelector('select[name="gender"]');
        const genderTextDisplay = document.querySelector('.text-display.gender');

        if (genderSelect) {
            genderSelect.disabled = true;
            genderSelect.style.display = 'none';
        }
        if (genderTextDisplay) {
            genderTextDisplay.style.display = 'block';
        }

        document.querySelector('.edit-button').style.display = 'inline';
        document.querySelector('.save-button').style.display = 'none';
        document.querySelector('.cancel-button').style.display = 'none';
    }
</script>
</body>
</html>
