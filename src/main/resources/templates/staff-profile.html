<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${staff.name} + ': Profile'">Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/template.css">
    <link rel="stylesheet" href="/iconfonts/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <style>
        .content-wrapper {
            flex: 1;
            margin: 0 !important;
            padding: 0 !important;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
<div class="content-wrapper">
    <div th:replace="trainer-nav.html"></div>
    <div class="content-body">
        <div class="profile-container">
            <h3 class="profile-header">Member Profile</h3>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/staff/update/{staffId}(staffId=${staff.staffId})}" th:object="${staff}" method="post">
                <table class="profile-table">
                    <tr>
                        <th>ID</th>
                        <td th:text="${staff.staffId}"></td>
                    </tr>
                    <tr>
                        <th>Name</th>
                        <td>
                            <span class="text-display" th:text="${staff.name}"></span>
                            <input type="text" th:field="*{name}" class="text-input" required>
                        </td>
                    </tr>
                    <tr>
                        <th>Phone</th>
                        <td>
                            <span class="text-display" th:text="${staff.phone}"></span>
                            <input type="text" th:field="*{phone}" class="text-input" readonly>
                        </td>
                    </tr>
                    <tr>
                        <th>Gender</th>
                        <td>
                            <span class="text-display gender-display" th:text="${staff.gender}"></span>
                            <select th:field="*{gender}" class="text-input gender-select" style="display: none;" required>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>Level</th>
                        <td>
                            <span class="text-display" th:text="${staff.level}"></span>
                            <input type="hidden" th:field="*{level}">
                        </td>
                    </tr>
                    <tr>
                        <th>Salary</th>
                        <td>
                            <span class="text-display" th:text="${staff.salary}"></span>
                            <input type="hidden" th:field="*{salary}">
                        </td>
                    </tr>
                    <tr>
                        <th>Course ID</th>
                        <td>
                            <span class="text-display" th:text="${staff.courseId}"></span>
                            <input type="hidden" th:field="*{courseId}">
                        </td>
                    </tr>
                </table>
                <div class="button-container">
                    <button type="button" onclick="enableEdit()" class="edit-button">Edit</button>
                    <button type="submit" class="save-button" style="display: none;">Save</button>
                    <button type="button" class="cancel-button" style="display: none;" onclick="cancelEdit()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
<footer class="footer">
    <div class="d-sm-flex justify-content-center justify-content-sm-between">
        <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright &copy; 2024. H-XYZ Gym Management System.</span>
    </div>
</footer>

<script src="/js/staff-profile.js"></script>
</body>
</html>
