<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="back.html :: backButton"></div>
<h1>Purchase List</h1>
<table>
    <thead>
    <tr>
        <th>Purchase ID</th>
        <th>Member ID</th>
        <th>Plan</th>
        <th>Effective Date</th>
        <th>End Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="purchase : ${purchases}"
        th:attr="onclick=|window.location.href='/member/details/' + '${purchase.member?.memberId}';|">
        <td th:text="${purchase.purchaseId}"></td>
        <td>
            <!-- 如果member对象存在，显示为链接，否则显示文本 -->
            <a th:if="${purchase.member != null}"
               th:href="@{/member/details/{memberId}(memberId=${purchase.member.memberId})}"
               th:text="${purchase.member.memberId}">Member ID</a>
            <span th:unless="${purchase.member != null}" th:text="${purchase.member.memberId ?: 'No Member'}">No Member</span>
        </td>
        <td th:text="${purchase.plan}"></td>
        <td th:text="${#dates.format(purchase.purchaseDate, 'yyyy-MM-dd')}"></td>
        <td th:text="${#dates.format(purchase.endDate, 'yyyy-MM-dd')}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
